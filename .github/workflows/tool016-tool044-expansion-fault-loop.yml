name: TOOL016 TOOL044 Expansion Fault Loop

on:
  push:
    paths:
      - '.github/workflows/tool016-tool044-expansion-fault-loop.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: tool016-tool044-expansion-fault-loop
  cancel-in-progress: false

env:
  CORRELATION_ID: T16-T44-MINCIRC-20260925-001

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Create durable bulk queue and pre-failure checkpoints
        run: |
          mkdir -p runtime
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          now=datetime.now(timezone.utc).isoformat()
          jobs=[]
          for suffix in ('FAULT','NORMAL-A','NORMAL-B'):
              jid=f"{os.environ['CORRELATION_ID']}-{suffix}-{os.environ['GITHUB_RUN_ID']}"
              jobs.append({'job_id':jid,'correlation_id':os.environ['CORRELATION_ID'],'status':'QUEUED','lease_owner':None,'heartbeat':now,'checkpoint':{'stage':1,'total_stages':2},'result':None})
          json.dump({'generated_at':now,'run_id':os.environ['GITHUB_RUN_ID'],'jobs':jobs},open('runtime/queue.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: expansion-queue
          path: runtime/queue.json

  workers:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        item: [FAULT, NORMAL-A, NORMAL-B]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: expansion-queue
          path: runtime
      - name: Claim, heartbeat, checkpoint and execute
        id: execute
        continue-on-error: true
        env:
          ITEM: ${{ matrix.item }}
        run: |
          mkdir -p receipts
          python - <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          q=json.load(open('runtime/queue.json'))
          row=next(x for x in q['jobs'] if f"-{os.environ['ITEM']}-" in x['job_id'])
          now=datetime.now(timezone.utc).isoformat()
          row.update(status='CLAIMED',lease_owner=f"GITHUB_ACTIONS:{os.environ['ITEM']}",claim=now,heartbeat=now)
          row['checkpoint']={'stage':1,'total_stages':2,'saved_at':now}
          if os.environ['ITEM']=='FAULT':
              row.update(status='FAILED_CONTROLLED',failure_detectable=True,failure_at=now)
          else:
              row.update(status='COMPLETED',result='EXPECTED_ACTUAL_MATCH',completed_at=now)
          json.dump(row,open(f"receipts/{os.environ['ITEM']}.json",'w'),indent=2)
          if os.environ['ITEM']=='FAULT': sys.exit(17)
          PY
      - name: Preserve worker receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-${{ matrix.item }}
          path: receipts/${{ matrix.item }}.json

  watchdog:
    needs: workers
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: worker-*
          path: receipts
          merge-multiple: true
      - name: Detect failure, reclaim lease, resume checkpoint and complete
        run: |
          python - <<'PY'
          import glob,json,os
          from datetime import datetime, timezone
          rows=[json.load(open(p)) for p in glob.glob('receipts/*.json')]
          failed=next(x for x in rows if x['status']=='FAILED_CONTROLLED')
          normal=[x for x in rows if x['status']=='COMPLETED']
          assert len(normal)==2 and all(x['result']=='EXPECTED_ACTUAL_MATCH' for x in normal)
          assert failed['checkpoint']['stage']==1 and failed['failure_detectable']
          now=datetime.now(timezone.utc).isoformat()
          failed.update(status='COMPLETED_AFTER_RECOVERY',watchdog_detected=True,stale_reclaim=True,
                        prior_lease_owner=failed['lease_owner'],lease_owner='GITHUB_ACTIONS:WATCHDOG',
                        reclaimed_at=now,resumed_from_stage=failed['checkpoint']['stage'],
                        checkpoint={'stage':2,'total_stages':2,'saved_at':now},
                        result='EXPECTED_ACTUAL_MATCH_AFTER_RESUME',completed_at=now)
          evidence={'run_id':os.environ['GITHUB_RUN_ID'],'correlation_id':os.environ['CORRELATION_ID'],
                    'queue_claim':True,'heartbeat':True,'checkpoint_before_failure':True,
                    'controlled_failure':True,'failure_detection':True,'watchdog_recovery':True,
                    'stale_reclaim':True,'lease_transfer':True,'checkpoint_resume':True,
                    'failure_isolation':len(normal)==2,'post_failure_result_return':True,
                    'bulk_execution_verified':True,'parallel_independent_jobs':3,
                    'actual_environment':'GITHUB_ACTIONS','multi_env':'HOLD_NO_APPROVED_CREDENTIAL_FREE_ENV2',
                    'jobs':normal+[failed],'timestamp':now}
          json.dump(evidence,open('expansion_evidence.json','w'),indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: expansion-evidence
          path: expansion_evidence.json

  persist:
    needs: watchdog
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: expansion-evidence
          path: runtime
      - name: Persist result and rolling unattended history
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('feedback_pipeline/evidence')
          current=json.load(open('runtime/expansion_evidence.json'))
          current.update(tool016_status_update='PASS',next_job_ready=True,user_manual_relay_required=0,
                         unattended_loop_started=True,continuous_24h_verified='IN_PROGRESS')
          out=root/'T16-T44-MINCIRC-20260925-001_expansion_fault_loop.json'
          out.write_text(json.dumps(current,indent=2)+'\n')
          history=root/'T16-T44-MINCIRC-20260925-001_unattended_history.jsonl'
          with history.open('a') as f: f.write(json.dumps(current,separators=(',',':'))+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feedback_pipeline/evidence/T16-T44-MINCIRC-20260925-001_expansion_fault_loop.json feedback_pipeline/evidence/T16-T44-MINCIRC-20260925-001_unattended_history.jsonl
          git commit -m 'tool044: persist expansion fault recovery cycle'
          git pull --rebase origin main
          git push origin HEAD:main
