name: Deploy TOOL043 Observer

on:
  push:
    branches: [main]
    paths:
      - 'tool043/**'
      - 'public/**'
      - '.github/workflows/tool043-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tool043-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce central admission and user stop before work
        env:
          WIC_USER_STOP: ${{ vars.WIC_USER_STOP }}
          WIC_RULE_ADMISSION_JSON: ${{ vars.WIC_RULE_ADMISSION_JSON }}
        run: python CONTROL_TOWER/controller/pre_work_admission.py --require-admission --work-id workflow:tool043-pages --task-id TOOL043
      - uses: actions/configure-pages@v5
      - name: Stage existing tool entrypoints
        run: |
          mkdir -p _site/tool020 _site/revenue-lab
          cp -R tool043/. _site/
          cp public/index.html _site/tool020/index.html
          cp -R public/revenue-lab/. _site/revenue-lab/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy observer and TOOL020
        id: deployment
        uses: actions/deploy-pages@v4
