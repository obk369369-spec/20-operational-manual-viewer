name: Deploy TOOL043 Observer

on:
  push:
    branches: [main]
    paths:
      - 'tool043/**'
      - 'public/**'
      - '.github/workflows/tool043-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tool043-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage existing tool entrypoints
        run: |
          mkdir -p _site/tool020
          cp -R tool043/. _site/
          cp public/index.html _site/tool020/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy observer and TOOL020
        id: deployment
        uses: actions/deploy-pages@v4
