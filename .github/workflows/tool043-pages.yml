name: Deploy TOOL043 Observer

on:
  push:
    branches: [main]
    paths:
      - 'tool043/**'
      - '.github/workflows/tool043-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tool043-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tool043
      - name: Deploy observer view
        id: deployment
        uses: actions/deploy-pages@v4
