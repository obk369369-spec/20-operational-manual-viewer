name: WIC Work Gate Handoff Audit
on:
  push:
    paths:
      - 'feedback_pipeline/work_gate_handoff.py'
      - 'feedback_pipeline/work_execution_enforcer.py'
      - 'feedback_pipeline/work_credit_waste_start_gate.py'
      - 'feedback_pipeline/WIC_WORK_CREDIT_WASTE_PREVENTION_MANUAL.md'
      - 'feedback_pipeline/WIC_WORK_COMMON_EXECUTION_BLOCK.md'
      - 'WIC_EXECUTION_STATE.json'
      - '.github/workflows/work-gate-handoff-audit.yml'
  workflow_dispatch:
    inputs:
      candidate_json:
        description: 'Exact scoped maintenance candidate JSON; empty runs the existing audit only'
        required: false
        type: string
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: read
jobs:
  work-gate-audit:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.candidate_json == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Automatic waste gate fixtures
        run: python feedback_pipeline/work_credit_waste_start_gate.py
      - name: Work execution audit regression
        run: python feedback_pipeline/work_execution_enforcer.py --self-test
      - name: Work and TOOL044 mutual exclusion and resume regression
        run: python feedback_pipeline/tool044_work_parallel.py --self-test
      - name: Deterministic Work gate fixtures
        run: python feedback_pipeline/work_gate_handoff.py --self-test
      - name: Generate exact Work handoff and exit template
        run: python feedback_pipeline/work_gate_handoff.py --state WIC_EXECUTION_STATE.json --output work-handoff.json --exit-template-output work-exit-checkpoint-template.json
      - name: Validate eligible lanes are exact packages
        run: |
          python - <<'PY'
          import json
          handoff=json.load(open('work-handoff.json', encoding='utf-8'))
          exit_template=json.load(open('work-exit-checkpoint-template.json', encoding='utf-8'))
          assert handoff['candidate_count'] > 0, 'zero candidates is N/A, never PASS'
          assert handoff['target_conservation'] is True
          assert handoff['pass_claimed'] is True
          for lane in handoff['eligible_work_lanes']:
              row=handoff['candidates'][lane]
              assert row['decision']=='WORK_ELIGIBLE'
              assert not row['missing_handoff']
              assert lane in exit_template['templates']
          print('PASS: exact Work handoff + resumable exit template validation')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wic-work-handoff
          path: |
            work-handoff.json
            work-exit-checkpoint-template.json

  candidate-gate-evaluation:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_json != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Evaluate candidate with pinned fresh CENTRAL
        env:
          CANDIDATE_JSON: ${{ inputs.candidate_json }}
        run: |
          printf '%s' "$CANDIDATE_JSON" > "$RUNNER_TEMP/wic-candidate.json"
          python feedback_pipeline/work_gate_handoff.py --resume-latest --candidate "$RUNNER_TEMP/wic-candidate.json" > "$RUNNER_TEMP/wic-candidate-decision.json" || result=$?
          cat "$RUNNER_TEMP/wic-candidate-decision.json"
          python - "$RUNNER_TEMP/wic-candidate.json" "$RUNNER_TEMP/wic-candidate-decision.json" <<'PY'
          import json, sys
          candidate = json.load(open(sys.argv[1], encoding='utf-8'))
          result = json.load(open(sys.argv[2], encoding='utf-8'))
          assert result.get('status') == 'RESUME_LOADED', result
          admission = result.get('work_admission') or {}
          decision = admission.get('decision')
          assert decision == 'WORK_DEFER_DENIED' and candidate.get('gates', {}).get('github') is True, admission
          print('PASS: scoped candidate evaluated; lower-cost GitHub lane retained, Work execution denied')
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: wic-candidate-gate-decision
          path: ${{ runner.temp }}/wic-candidate-decision.json
