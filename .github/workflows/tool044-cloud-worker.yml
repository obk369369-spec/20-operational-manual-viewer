name: TOOL044 Public Safe Cloud Worker

# GitHub Actions bootstrap stays scheduled while independent free runtimes are
# discovered and verified. GitHub-only execution never counts as multi-runtime PASS.
on:
  push:
    paths:
      - '.github/workflows/tool044-cloud-worker.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      isolated_test:
        description: Run one synthetic demand without touching production state
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: tool044-cloud-local-shared-state
  cancel-in-progress: false

jobs:
  public-safe-worker:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.isolated_test }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Contract and restart-resume test
        run: python feedback_pipeline/tool044_cloud_worker.py --self-test
      - name: Request decomposition self-test
        run: python feedback_pipeline/tool044_request_router.py --self-test
      - name: Select verified inventory before discovery
        id: inventory
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          ready = json.loads(Path('feedback_pipeline/evidence/tool044_ready_package_pool.json').read_text(encoding='utf-8'))
          verified = json.loads(Path('feedback_pipeline/evidence/tool044_verified_external_component_pool.json').read_text(encoding='utf-8'))
          ready_count = ready.get('ready_package_count', len(ready.get('ready_packages', [])))
          verified_count = len(verified.get('components', verified.get('verified_components', [])))
          need = ready_count < 2 or verified_count < 14
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"need_discovery={'true' if need else 'false'}\n")
          print(json.dumps({'ready_package_count': ready_count, 'verified_component_count': verified_count,
                            'discovery': 'RUN' if need else 'SKIP_REUSE'}))
          PY
      - name: Dynamic discovery self-test
        if: steps.inventory.outputs.need_discovery == 'true'
        run: python feedback_pipeline/tool044_dynamic_discovery.py --self-test
      - name: Preload high-volume TOOL044 discovery queue for TOOL016
        if: steps.inventory.outputs.need_discovery == 'true'
        env:
          TOOL044_PRELOAD_TARGET: '1000'
          TOOL044_PRELOAD_GROWTH_MODE: 'REPORT_CYCLE_ESCALATE'
          TOOL044_PRELOAD_MIN_INCREMENT: '500'
          TOOL044_PRELOAD_MODE: 'PARALLEL'
        run: |
          echo "TOOL044_PRELOAD_TARGET=$TOOL044_PRELOAD_TARGET"
          echo "TOOL044_PRELOAD_MODE=$TOOL044_PRELOAD_MODE"
          echo "TOOL044_PRELOAD_GROWTH_MODE=$TOOL044_PRELOAD_GROWTH_MODE"
          echo "TOOL044_PRELOAD_MIN_INCREMENT=$TOOL044_PRELOAD_MIN_INCREMENT"
          python feedback_pipeline/tool044_request_router.py
          python feedback_pipeline/tool044_dynamic_discovery.py
      - name: Fail-closed safe deployment and rollback fixture
        run: python feedback_pipeline/tool044_safe_integration.py
      - name: Process public-safe handoff
        env:
          GITHUB_ACTIONS: 'true'
        run: python feedback_pipeline/tool044_cloud_worker.py
      - name: Expand requests and TOOL016 gaps to atomic demands
        run: python feedback_pipeline/tool044_request_router.py
      - name: Verify TOOL016 source lineage handoff
        run: python feedback_pipeline/tool016_tool044_lineage_e2e.py
      - name: Reuse latest bounded TOOL016 to TOOL044 sweep checkpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('feedback_pipeline/evidence/tool016_tool044_full_accessible_sweep_20260908.json')
          e = json.loads(p.read_text(encoding='utf-8'))
          assert e['counts']['checked_record_sources'] == 7
          missing = e.get('queue_lineage_missing', e.get('counts', {}).get('queue_lineage_missing'))
          assert isinstance(missing, list) and len(missing) == 38, missing
          print('SKIP_REUSE: bounded sweep checkpoint retained; discovery/ready-package lanes continue independently')
          PY
      - name: Harvest official pre-qualified candidates and test compositions
        if: steps.inventory.outputs.need_discovery == 'true'
        env:
          TOOL044_TRIGGER_SOURCE: ${{ github.event_name == 'schedule' && 'SCHEDULED' || 'WORK' }}
        run: python feedback_pipeline/tool044_atomic_watch_v2.py --external --trigger-source "$TOOL044_TRIGGER_SOURCE"
      - name: Parallel discover public candidates for unresolved atomic capabilities
        if: steps.inventory.outputs.need_discovery == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TOOL044_PRELOAD_TARGET: '1000'
        run: python feedback_pipeline/tool044_dynamic_discovery.py
      - name: Build evidence-gated ready-to-plug packages
        if: steps.inventory.outputs.need_discovery == 'true'
        run: |
          python feedback_pipeline/tool044_ready_package.py --self-test
          python feedback_pipeline/tool044_ready_package.py
      - name: Execute verified ready-made composition on actual canonical job pack
        run: |
          set -euo pipefail
          EVIDENCE=feedback_pipeline/evidence/wic_external_composition_actual_20261018.json
          if [ -e "$EVIDENCE" ]; then
            echo "SKIP_REUSE: actual composition evidence already persisted"
            exit 0
          fi
          python -m pip install --disable-pip-version-check --no-index             feedback_pipeline/external_candidate_pool/doit-0.37.0-py3-none-any.whl             feedback_pipeline/external_candidate_pool/fastjsonschema-2.21.2-py3-none-any.whl
          python - <<'PY'
          import hashlib, json, os, subprocess, sys, tempfile
          from datetime import datetime, timezone
          from pathlib import Path
          import fastjsonschema

          repo = Path.cwd()
          pack_path = repo / 'feedback_pipeline/external_factory_job_pack_20261016.json'
          pack = json.loads(pack_path.read_text(encoding='utf-8'))
          jobs = pack['jobs']
          cause_map = {
              'AUTHORIZATION_DATA_ACCESS': [],
              'FILE_PROCESSING_OUTPUT_IDENTITY': [],
              'EXECUTOR_ORCHESTRATION': [],
              'DEPLOY_REMOTE_READBACK': [],
              'VALIDATION_EVIDENCE': [],
              'STATE_PERSISTENCE_RECOVERY': [],
          }
          for job in jobs:
              jid = job['JOB_ID']
              root = job['ROOT_CAUSE']
              if 'SOURCE_PAYLOAD' in root or 'EXTERNAL' in root:
                  cause_map['AUTHORIZATION_DATA_ACCESS'].append(jid)
              if 'ASSEMBLY' in root or 'OUTPUT_FIELD' in root:
                  cause_map['FILE_PROCESSING_OUTPUT_IDENTITY'].append(jid)
              if 'PLATFORM' in root or 'TIME_CONTINUITY' in root:
                  cause_map['EXECUTOR_ORCHESTRATION'].append(jid)
              if 'DEPLOYMENT' in root or job.get('DEPLOY_REQUIRED'):
                  cause_map['DEPLOY_REMOTE_READBACK'].append(jid)
              if job.get('INDEPENDENT_VALIDATION_REQUIRED'):
                  cause_map['VALIDATION_EVIDENCE'].append(jid)
              if job.get('RECOVERY_REQUIRED'):
                  cause_map['STATE_PERSISTENCE_RECOVERY'].append(jid)

          schema = {
              'type': 'object', 'required': ['execution_id','input_sha256','groups','result'],
              'properties': {
                  'execution_id': {'type':'string', 'minLength':1},
                  'input_sha256': {'type':'string', 'pattern':'^[0-9a-f]{64}        if: ${{ always() }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for path in \
            feedback_pipeline/TOOL044_REQUEST_INBOX.json \
            feedback_pipeline/tool044_atomic_demand_queue.json \
            feedback_pipeline/tool044_cloud_state.json \
            feedback_pipeline/tool044_local_required_queue.json \
            feedback_pipeline/evidence/tool044_atomic_watch_state.json \
            feedback_pipeline/evidence/tool044_external_candidate_pool.json \
            feedback_pipeline/evidence/tool044_verified_external_component_pool.json \
            feedback_pipeline/evidence/tool044_verified_composition_pool.json \
            feedback_pipeline/evidence/tool044_dynamic_candidate_pool.json \
            feedback_pipeline/evidence/tool044_ready_package_pool.json \
            feedback_pipeline/evidence/tool044_safe_integration_fixture.json \
            feedback_pipeline/evidence/wic_external_composition_actual_20261018.json; do
            if [ -e "$path" ]; then git add -- "$path"; fi
          done
          # Worker-owned tracked state may be refreshed indirectly (for
          # example function-state provenance).  Include only tracked changes
          # so an uncommitted checkpoint cannot block restart/resume.
          git add -u -- feedback_pipeline
          if [ -e feedback_pipeline/evidence/tool016_tool044_source_lineage_e2e_20260908.json ]; then
            git add -- feedback_pipeline/evidence/tool016_tool044_source_lineage_e2e_20260908.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'tool044: persist accelerated cloud factory checkpoint'
          git pull --rebase origin main
          git push origin HEAD:main

  isolated-central-return:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.isolated_test) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore previous isolated state
        if: ${{ github.event_name == 'schedule' }}
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          WIC_ISOLATED_DIR: ${{ runner.temp }}/wic-isolated-${{ github.run_id }}
        run: |
          set -euo pipefail
          artifact=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '[.artifacts[] | select((.name | startswith("wic-isolated-")) and (.expired == false))] | sort_by(.created_at) | last | "\(.workflow_run.id) \(.name)"')
          read -r source_run artifact_name <<< "$artifact"
          test -n "$source_run" && test "$source_run" != null
          mkdir -p "$WIC_ISOLATED_DIR"
          gh run download "$source_run" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "$WIC_ISOLATED_DIR"
          echo "source_run=$source_run" >> "$GITHUB_OUTPUT"
      - name: Process isolated synthetic demand and record central ACK
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          WIC_ISOLATED_DIR: ${{ runner.temp }}/wic-isolated-${{ github.run_id }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          root = Path(os.environ['WIC_ISOLATED_DIR'])
          (root / 'evidence').mkdir(parents=True)
          test_id = f"WIC-ISOLATED-{os.environ['GITHUB_RUN_ID']}"
          demand = {
              'demand_id': test_id, 'request_id': test_id, 'root_id': test_id,
              'target_tool': 'TOOL044', 'atomic_capabilities': ['FIXTURE_UNAVAILABLE_CAPABILITY'],
              'status': 'OPEN', 'source': 'TOOL044_REQUEST_INBOX',
              'source_records': [{'ROOT_ID': test_id, 'TOOL044_DEMAND_ID': test_id,
                                  'SOURCE_EVIDENCE': 'synthetic-fixture'}],
          }
          inputs = {
              'queue.json': {'schema_version': 1, 'demands': [demand]},
              'registry.json': {'components': [], 'verified_atomic_component_pool': []},
              'TOOL044_REQUEST_INBOX.json': {'requests': [
                  {'request_id': test_id, 'root_id': test_id, 'source_evidence': 'synthetic-fixture'}]},
              'state.json': {'integration_core': {'feedback_checkpoints': {test_id: {}}}},
          }
          for name, value in inputs.items():
              (root / name).write_text(json.dumps(value), encoding='utf-8')
          subprocess.run([sys.executable, 'feedback_pipeline/tool044_atomic_watch_v2.py',
                          '--queue', str(root / 'queue.json'), '--registry', str(root / 'registry.json'),
                          '--state', str(root / 'evidence' / 'watch_state.json'),
                          '--trigger-source', 'WORK'], check=True, capture_output=True, text=True)
          state = json.loads((root / 'evidence' / 'watch_state.json').read_text(encoding='utf-8'))
          checkpoint = json.loads((root / 'state.json').read_text(encoding='utf-8'))['integration_core']['feedback_checkpoints'][test_id]
          receipt = {
              'test_id': test_id, 'demand_id': test_id,
              'tool044_processed': state.get('demands_processed'),
              'central_returns': state.get('tool016_result_returns'),
              'central_ack': checkpoint.get('tool044_worker_return_ack'),
              'central_received': checkpoint.get('tool044_natural_worker_return', {}).get('ack'),
              'isolated_persistence': (root / 'evidence' / 'watch_state.json').is_file(),
              'production_mutations': state.get('production_mutations'),
          }
          assert receipt['tool044_processed'] == 1 and receipt['central_returns'] == 1
          assert receipt['central_ack'] == 'PASS' and receipt['central_received'] == 'TOOL016_CENTRAL_RECEIVED'
          assert receipt['isolated_persistence'] and receipt['production_mutations'] == 0
          assert not subprocess.run(['git', 'status', '--porcelain'], capture_output=True, text=True,
                                    check=True).stdout.strip()
          (root / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(receipt))
          PY
      - name: Verify scheduled isolated cross-run continuity
        if: ${{ github.event_name == 'schedule' }}
        env:
          WIC_ISOLATED_DIR: ${{ runner.temp }}/wic-isolated-${{ github.run_id }}
          WIC_SOURCE_RUN: ${{ steps.restore.outputs.source_run }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          root = Path(os.environ['WIC_ISOLATED_DIR'])
          state_path = root / 'evidence' / 'watch_state.json'
          before = json.loads(state_path.read_text(encoding='utf-8'))
          previous_receipt = json.loads((root / 'receipt.json').read_text(encoding='utf-8'))
          test_id = previous_receipt['test_id']
          central_path = root / 'state.json'
          previous_checkpoint = json.loads(central_path.read_text(encoding='utf-8'))['integration_core']['feedback_checkpoints'][test_id]
          subprocess.run([sys.executable, 'feedback_pipeline/tool044_atomic_watch_v2.py',
                          '--queue', str(root / 'queue.json'), '--registry', str(root / 'registry.json'),
                          '--state', str(state_path), '--trigger-source', 'SCHEDULED'],
                         check=True, capture_output=True, text=True)
          state = json.loads(state_path.read_text(encoding='utf-8'))
          checkpoint = json.loads(central_path.read_text(encoding='utf-8'))['integration_core']['feedback_checkpoints'][test_id]
          receipt = {
              'test_id': test_id, 'source_run': os.environ['WIC_SOURCE_RUN'],
              'restored_state_id': before['cycle_id'], 'state_id': state['cycle_id'],
              'previous_state_restored': any(item.get('demand_id') == test_id for item in before['results']),
              'completed_reprocessed': state.get('demands_processed'),
              'duplicate_central_returns': state.get('tool016_result_returns'),
              'new_processed': 0, 'new_central_returns': 0,
              'checkpoint_preserved': checkpoint == previous_checkpoint,
              'isolated_persistence': state_path.is_file(),
              'production_mutations': state.get('production_mutations'),
          }
          assert receipt['previous_state_restored'] and receipt['checkpoint_preserved']
          assert receipt['completed_reprocessed'] == 0 and receipt['duplicate_central_returns'] == 0
          assert receipt['isolated_persistence'] and receipt['production_mutations'] == 0
          assert not subprocess.run(['git', 'status', '--porcelain'], capture_output=True, text=True,
                                    check=True).stdout.strip()
          (root / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wic-isolated-${{ github.run_id }}
          path: ${{ runner.temp }}/wic-isolated-${{ github.run_id }}/
},
                  'groups': {'type':'object', 'minProperties':6},
                  'result': {'const':'PASS'}
              }
          }
          validate = fastjsonschema.compile(schema)
          work = Path(tempfile.mkdtemp(prefix='wic-composition-'))
          (work/'input.json').write_text(json.dumps({'jobs':jobs}), encoding='utf-8')
          dodo = work/'dodo.py'
          dodo.write_text("""
import json
from pathlib import Path
def task_materialize():
    return {'actions': [(Path('materialized.ok').write_text, ['PASS'], {'encoding':'utf-8'})],
            'targets': ['materialized.ok']}
def task_verify():
    return {'actions': ['python -c "from pathlib import Path; assert Path(\\'materialized.ok\\').read_text()==\\'PASS\\'"'],
            'task_dep': ['materialize'], 'targets': ['verified.ok'],
            'uptodate': [False]}
""", encoding='utf-8')
          run = subprocess.run([sys.executable, '-m', 'doit', '-f', str(dodo), 'materialize'],
                               cwd=work, text=True, capture_output=True)
          if run.returncode:
              raise SystemExit(run.stdout + run.stderr)
          negative_blocked = False
          try:
              validate({'execution_id':'bad','input_sha256':'bad','groups':{},'result':'PASS'})
          except Exception:
              negative_blocked = True
          assert negative_blocked
          receipt = {
              'schema':'wic.external-composition-actual.v1',
              'executed_at_utc':datetime.now(timezone.utc).isoformat(),
              'execution_id':f"GITHUB-ACTIONS-{os.environ['GITHUB_RUN_ID']}",
              'runner':'GITHUB_ACTIONS_UBUNTU',
              'input':'feedback_pipeline/external_factory_job_pack_20261016.json',
              'input_sha256':hashlib.sha256(pack_path.read_bytes()).hexdigest(),
              'components':[
                  'DOIT_0_37_0_LOCAL_DAG_EXECUTION_ENGINE',
                  'FASTJSONSCHEMA_2_21_2_TOOL043_PROOF',
                  'EXISTING_TOOL044_DURABLE_CHECKPOINT'
              ],
              'groups':cause_map,
              'job_count':len(jobs),
              'parallelizable_jobs':pack['counts']['PARALLEL_READY_JOB_COUNT'],
              'dependency_blocked_jobs':pack['counts']['DEPENDENCY_BLOCKED_JOB_COUNT'],
              'negative_invalid_output_blocked':negative_blocked,
              'durable_result_path':'feedback_pipeline/evidence/wic_external_composition_actual_20261018.json',
              'result':'PASS',
              'tool013_gate':'STOP_UNTIL_COMPLETE_MIGRATION_AND_INPUT_MOUNT'
          }
          validate(receipt)
          out = repo/'feedback_pipeline/evidence/wic_external_composition_actual_20261018.json'
          out.write_text(json.dumps(receipt, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(json.dumps(receipt))
          PY
      - name: Persist shared state checkpoint
        if: ${{ always() }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for path in \
            feedback_pipeline/TOOL044_REQUEST_INBOX.json \
            feedback_pipeline/tool044_atomic_demand_queue.json \
            feedback_pipeline/tool044_cloud_state.json \
            feedback_pipeline/tool044_local_required_queue.json \
            feedback_pipeline/evidence/tool044_atomic_watch_state.json \
            feedback_pipeline/evidence/tool044_external_candidate_pool.json \
            feedback_pipeline/evidence/tool044_verified_external_component_pool.json \
            feedback_pipeline/evidence/tool044_verified_composition_pool.json \
            feedback_pipeline/evidence/tool044_dynamic_candidate_pool.json \
            feedback_pipeline/evidence/tool044_ready_package_pool.json \
            feedback_pipeline/evidence/tool044_safe_integration_fixture.json; do
            if [ -e "$path" ]; then git add -- "$path"; fi
          done
          # Worker-owned tracked state may be refreshed indirectly (for
          # example function-state provenance).  Include only tracked changes
          # so an uncommitted checkpoint cannot block restart/resume.
          git add -u -- feedback_pipeline
          if [ -e feedback_pipeline/evidence/tool016_tool044_source_lineage_e2e_20260908.json ]; then
            git add -- feedback_pipeline/evidence/tool016_tool044_source_lineage_e2e_20260908.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'tool044: persist accelerated cloud factory checkpoint'
          git pull --rebase origin main
          git push origin HEAD:main

  isolated-central-return:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.isolated_test) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore previous isolated state
        if: ${{ github.event_name == 'schedule' }}
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          WIC_ISOLATED_DIR: ${{ runner.temp }}/wic-isolated-${{ github.run_id }}
        run: |
          set -euo pipefail
          artifact=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '[.artifacts[] | select((.name | startswith("wic-isolated-")) and (.expired == false))] | sort_by(.created_at) | last | "\(.workflow_run.id) \(.name)"')
          read -r source_run artifact_name <<< "$artifact"
          test -n "$source_run" && test "$source_run" != null
          mkdir -p "$WIC_ISOLATED_DIR"
          gh run download "$source_run" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir "$WIC_ISOLATED_DIR"
          echo "source_run=$source_run" >> "$GITHUB_OUTPUT"
      - name: Process isolated synthetic demand and record central ACK
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          WIC_ISOLATED_DIR: ${{ runner.temp }}/wic-isolated-${{ github.run_id }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          root = Path(os.environ['WIC_ISOLATED_DIR'])
          (root / 'evidence').mkdir(parents=True)
          test_id = f"WIC-ISOLATED-{os.environ['GITHUB_RUN_ID']}"
          demand = {
              'demand_id': test_id, 'request_id': test_id, 'root_id': test_id,
              'target_tool': 'TOOL044', 'atomic_capabilities': ['FIXTURE_UNAVAILABLE_CAPABILITY'],
              'status': 'OPEN', 'source': 'TOOL044_REQUEST_INBOX',
              'source_records': [{'ROOT_ID': test_id, 'TOOL044_DEMAND_ID': test_id,
                                  'SOURCE_EVIDENCE': 'synthetic-fixture'}],
          }
          inputs = {
              'queue.json': {'schema_version': 1, 'demands': [demand]},
              'registry.json': {'components': [], 'verified_atomic_component_pool': []},
              'TOOL044_REQUEST_INBOX.json': {'requests': [
                  {'request_id': test_id, 'root_id': test_id, 'source_evidence': 'synthetic-fixture'}]},
              'state.json': {'integration_core': {'feedback_checkpoints': {test_id: {}}}},
          }
          for name, value in inputs.items():
              (root / name).write_text(json.dumps(value), encoding='utf-8')
          subprocess.run([sys.executable, 'feedback_pipeline/tool044_atomic_watch_v2.py',
                          '--queue', str(root / 'queue.json'), '--registry', str(root / 'registry.json'),
                          '--state', str(root / 'evidence' / 'watch_state.json'),
                          '--trigger-source', 'WORK'], check=True, capture_output=True, text=True)
          state = json.loads((root / 'evidence' / 'watch_state.json').read_text(encoding='utf-8'))
          checkpoint = json.loads((root / 'state.json').read_text(encoding='utf-8'))['integration_core']['feedback_checkpoints'][test_id]
          receipt = {
              'test_id': test_id, 'demand_id': test_id,
              'tool044_processed': state.get('demands_processed'),
              'central_returns': state.get('tool016_result_returns'),
              'central_ack': checkpoint.get('tool044_worker_return_ack'),
              'central_received': checkpoint.get('tool044_natural_worker_return', {}).get('ack'),
              'isolated_persistence': (root / 'evidence' / 'watch_state.json').is_file(),
              'production_mutations': state.get('production_mutations'),
          }
          assert receipt['tool044_processed'] == 1 and receipt['central_returns'] == 1
          assert receipt['central_ack'] == 'PASS' and receipt['central_received'] == 'TOOL016_CENTRAL_RECEIVED'
          assert receipt['isolated_persistence'] and receipt['production_mutations'] == 0
          assert not subprocess.run(['git', 'status', '--porcelain'], capture_output=True, text=True,
                                    check=True).stdout.strip()
          (root / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
