name: WIC Stall Heartbeat Monitor

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      user_explicit_request:
        description: 'Audit trace reference; authorization is the authenticated manual workflow dispatch itself'
        required: true
        type: string

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  check-observer-heartbeat:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build canonical night queue and mobile observer state
        shell: bash
        run: |
          set -euo pipefail
          python feedback_pipeline/work_execution_enforcer.py --record
          python tool043/night_observer.py
          if git diff --quiet -- tool043/status.json tool043/night_queue.json feedback_pipeline/evidence/work_execution_audit_20260827.json; then
            echo 'Night observer state already current.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add tool043/status.json tool043/night_queue.json feedback_pipeline/evidence/work_execution_audit_20260827.json
            git commit -m 'wic: sync night queue and mobile observer state'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Sync canonical observer from execution state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          state_path = Path("WIC_EXECUTION_STATE.json")
          observer_path = Path("WIC_OBSERVER_STATUS.md")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          observer = observer_path.read_text(encoding="utf-8")

          status = state.get("structure_status", "확인 필요")
          updated = state.get("updated_kst", "확인 필요")
          identity = state.get("chat_identity_lock", {})
          checkpoint = state.get("additional_work_preparation_checkpoint") or state.get("work_preparation_checkpoint") or {}
          restart = checkpoint.get("restart_point") or state.get("restart_point") or "확인 필요"
          if isinstance(restart, list):
              restart = " / ".join(str(item) for item in restart)
          blockers = state.get("blockers", {})
          blocker_text = "없음" if not blockers else " / ".join(f"{key}: {value}" for key, value in blockers.items())

          begin = "<!-- WIC_EXECUTION_STATE_SYNC_START -->"
          end = "<!-- WIC_EXECUTION_STATE_SYNC_END -->"
          block = f"""<!-- WIC_EXECUTION_STATE_SYNC_START -->
          ## 중앙 실행상태 자동 동기화

          | 항목 | 실제 값 |
          |---|---|
          | 중앙 상태 | `{status}` |
          | 중앙 상태 갱신 | `{updated} KST` |
          | checkpoint | `{checkpoint.get('status', '확인 필요')}` |
          | 대화 identity 보호 | `{identity.get('status', '확인 필요')}` |
          | restart point | {restart} |
          | blocker | {blocker_text} |

          - 이 구역은 `WIC_EXECUTION_STATE.json`에서 자동 생성한다.
          - Observer가 자체적으로 RUNNING을 추정하지 않고 중앙 실행상태를 그대로 표시한다.
          <!-- WIC_EXECUTION_STATE_SYNC_END -->"""

          if begin in observer and end in observer:
              prefix, rest = observer.split(begin, 1)
              _, suffix = rest.split(end, 1)
              observer = prefix + block + suffix
          else:
              observer = observer.rstrip() + "\n\n" + block + "\n"

          observer_path.write_text(observer, encoding="utf-8")
          PY
          if git diff --quiet -- WIC_OBSERVER_STATUS.md; then
            echo 'Observer already matches the central execution state.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WIC_OBSERVER_STATUS.md
          git commit -m 'Sync Observer from central execution state'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Check active execution state age
        id: age
        shell: bash
        run: |
          set -euo pipefail
          FILE='WIC_EXECUTION_STATE.json'
          MAX_AGE_MINUTES=60
          LAST_TS=$(git log -1 --format=%ct -- "$FILE")
          NOW_TS=$(date +%s)
          AGE_MIN=$(( (NOW_TS - LAST_TS) / 60 ))
          STRUCTURE_STATUS=$(python -c "import json; print(json.load(open('$FILE', encoding='utf-8')).get('structure_status', ''))")
          ACTIVE=$(python -c "import json; s=json.load(open('$FILE', encoding='utf-8')).get('structure_status', ''); print('true' if s in {'IN_PROGRESS','ACTIVE_EXECUTION','RUNNING'} else 'false')")
          if [ "$ACTIVE" = true ] && [ "$AGE_MIN" -gt "$MAX_AGE_MINUTES" ]; then
            STALE=true
            echo "::warning::Active WIC execution state is stale: ${AGE_MIN} minutes (limit ${MAX_AGE_MINUTES})."
          else
            STALE=false
            echo "WIC state active=${ACTIVE}, age=${AGE_MIN} minutes, status=${STRUCTURE_STATUS}."
          fi
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
          echo "stale=$STALE" >> "$GITHUB_OUTPUT"
          echo "age_minutes=$AGE_MIN" >> "$GITHUB_OUTPUT"
          echo "structure_status=$STRUCTURE_STATUS" >> "$GITHUB_OUTPUT"

      - name: Open one stall issue
        id: issue
        if: steps.age.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AGE_MIN: ${{ steps.age.outputs.age_minutes }}
          STRUCTURE_STATUS: ${{ steps.age.outputs.structure_status }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE='[WIC STALL] Active execution state stale'
          LEGACY_TITLE='[WIC STALL] Observer heartbeat stale'
          ISSUE=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -z "$ISSUE" ]; then
            ISSUE=$(gh issue list --state open --search "$LEGACY_TITLE in:title" --json number --jq '.[0].number // empty')
          fi
          if [ -z "$ISSUE" ]; then
            gh issue create --title "$TITLE" --body "Active execution state '${STRUCTURE_STATUS}' has not advanced for ${AGE_MIN} minutes. Resume from the saved restart point; do not repeat completed evidence."
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "Existing stall issue #$ISSUE represents this incident; no duplicate comment or recovery dispatch."
          fi

      - name: Re-dispatch existing recovery audit once
        if: steps.age.outputs.stale == 'true' && steps.issue.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run rule-governance-audit.yml --ref "${GITHUB_REF_NAME}"
          echo 'Existing recovery audit dispatched once for this stall incident.'

      - name: Close resolved stall issue
        if: steps.age.outputs.stale == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for TITLE in '[WIC STALL] Active execution state stale' '[WIC STALL] Observer heartbeat stale'; do
            ISSUE=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
            if [ -n "$ISSUE" ]; then
              gh issue close "$ISSUE" --comment 'Execution state is fresh or no longer active; stall condition cleared.'
            fi
          done
