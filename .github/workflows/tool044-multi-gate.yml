name: TOOL044 Verified Component Multi Gate

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      parallel_canary_count:
        description: 'Independent hosted-runner circulation canaries (0-30)'
        required: false
        default: '0'

permissions:
  contents: write
  actions: read

# Tracked legacy bytecode must not be rewritten by the runner: an unstaged
# pycache delta makes the durable-state `git pull --rebase` fail after tests.
env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: tool044-multi-gate-coordinator
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_jobs: ${{ steps.plan.outputs.has_jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Enforce central admission and user stop for prepare
        env:
          WIC_USER_STOP: ${{ vars.WIC_USER_STOP }}
          WIC_RULE_ADMISSION_JSON: ${{ vars.WIC_RULE_ADMISSION_JSON }}
        run: python CONTROL_TOWER/controller/pre_work_admission.py --require-admission --work-id 'workflow:tool044-multi-gate:prepare' --task-id TOOL044
      - id: plan
        name: Persist claims before execution
        run: >-
          python feedback_pipeline/tool044_multi_gate.py plan
          --parallel-canary-count '${{ inputs.parallel_canary_count || 0 }}'
          --github-output "$GITHUB_OUTPUT"
      - name: Verify common closeout and missing-evidence rejection
        run: python feedback_pipeline/test_wic_cycle_audit.py
      - name: Enforce development product release governor
        run: python feedback_pipeline/deployment_observer_gate.py --self-test
      - name: Refresh external runner candidates on periodic discovery cycle
        if: ${{ github.event_name == 'schedule' && github.event.schedule == '17 1 * * *' }}
        env:
          TOOL044_PRELOAD_TARGET: '1000'
        run: python feedback_pipeline/tool044_dynamic_discovery.py
      - name: Refresh visible TOOL016 TOOL044 handoff
        run: python feedback_pipeline/tool016_visible_handoff.py
      - name: Persist durable claim state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- CONTROL_TOWER/controller/component_registry.json feedback_pipeline/state.json feedback_pipeline/tool044_atomic_demand_queue.json feedback_pipeline/evidence/tool016_visible_handoff_state.json feedback_pipeline/evidence/wic_zero_touch_observer_report.json feedback_pipeline/evidence/wic_zero_touch_circulation_state.json feedback_pipeline/evidence/wic_non_tool_common_closeout_ledger.json feedback_pipeline/evidence/wic_non_tool_common_work_packet.json feedback_pipeline/evidence/wic_non_tool_observer_closeout_report.json feedback_pipeline/evidence/wic_automatic_handoff_state.json feedback_pipeline/evidence/wic_cycle_timing.json feedback_pipeline/evidence/tool044_multi_gate_state.json feedback_pipeline/evidence/tool044_verified_external_component_pool.json feedback_pipeline/evidence/tool044_dynamic_candidate_pool.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'tool044: persist multi-gate claims'
          git pull --rebase origin main
          git push origin HEAD:main

  lane:
    needs: prepare
    if: ${{ needs.prepare.outputs.has_jobs == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 30
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    concurrency:
      group: tool044-job-${{ matrix.job_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Enforce central admission and user stop for lane
        env:
          WIC_USER_STOP: ${{ vars.WIC_USER_STOP }}
          WIC_RULE_ADMISSION_JSON: ${{ vars.WIC_RULE_ADMISSION_JSON }}
        run: python CONTROL_TOWER/controller/pre_work_admission.py --require-admission --work-id 'workflow:tool044-multi-gate:lane:${{ matrix.job_id }}' --task-id TOOL044
      - name: Run isolated component lane
        run: >-
          python feedback_pipeline/tool044_multi_gate.py run-lane
          --job-id '${{ matrix.job_id }}'
          --owner '${{ matrix.owner }}'
          --fencing-token '${{ matrix.fencing_token }}'
          --result 'tool044-result-${{ matrix.gate_id }}.json'
      - name: Verify independent closure before lane PASS promotion
        env:
          WIC_CLOSURE_RECEIPTS_JSON: ${{ vars.WIC_CLOSURE_RECEIPTS_JSON }}
          WIC_USER_STOP: ${{ vars.WIC_USER_STOP }}
          WIC_RULE_ADMISSION_JSON: ${{ vars.WIC_RULE_ADMISSION_JSON }}
        run: python CONTROL_TOWER/controller/pre_work_admission.py --require-completion --work-id 'workflow:tool044-multi-gate:lane:${{ matrix.job_id }}' --task-id TOOL044
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tool044-result-${{ matrix.gate_id }}-${{ github.run_attempt }}
          path: tool044-result-${{ matrix.gate_id }}.json
          retention-days: 14

  aggregate:
    needs: [prepare, lane]
    if: ${{ always() && needs.prepare.outputs.has_jobs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Enforce central admission and user stop for aggregate
        env:
          WIC_USER_STOP: ${{ vars.WIC_USER_STOP }}
          WIC_RULE_ADMISSION_JSON: ${{ vars.WIC_RULE_ADMISSION_JSON }}
        run: python CONTROL_TOWER/controller/pre_work_admission.py --require-admission --work-id 'workflow:tool044-multi-gate:aggregate' --task-id TOOL044
      - uses: actions/download-artifact@v4
        with:
          pattern: tool044-result-*
          path: tool044-results
          merge-multiple: true
      - name: Return all lane results to TOOL016 central state
        run: |
          python feedback_pipeline/tool044_multi_gate.py aggregate tool044-results/*.json
          python feedback_pipeline/tool016_visible_handoff.py
      - name: Verify independent closure before aggregate PASS promotion
        env:
          WIC_CLOSURE_RECEIPTS_JSON: ${{ vars.WIC_CLOSURE_RECEIPTS_JSON }}
          WIC_USER_STOP: ${{ vars.WIC_USER_STOP }}
          WIC_RULE_ADMISSION_JSON: ${{ vars.WIC_RULE_ADMISSION_JSON }}
        run: python CONTROL_TOWER/controller/pre_work_admission.py --require-completion --work-id 'workflow:tool044-multi-gate:aggregate' --task-id TOOL044
      - name: Persist result and checkpoint
        if: ${{ success() }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- feedback_pipeline/state.json feedback_pipeline/tool044_atomic_demand_queue.json feedback_pipeline/evidence/tool016_visible_handoff_state.json feedback_pipeline/evidence/wic_zero_touch_observer_report.json feedback_pipeline/evidence/wic_zero_touch_circulation_state.json feedback_pipeline/evidence/wic_non_tool_common_closeout_ledger.json feedback_pipeline/evidence/wic_non_tool_common_work_packet.json feedback_pipeline/evidence/wic_non_tool_observer_closeout_report.json feedback_pipeline/evidence/wic_automatic_handoff_state.json feedback_pipeline/evidence/wic_cycle_timing.json feedback_pipeline/evidence/tool044_multi_gate_state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'tool044: return multi-gate results'
          git pull --rebase origin main
          git push origin HEAD:main
