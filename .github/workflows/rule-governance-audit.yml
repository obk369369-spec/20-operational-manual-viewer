name: WIC Rule Governance Audit

on:
  push:
    paths:
      - 'WIC_GLOBAL_OPERATING_RULES.md'
      - 'WIC_CHAT_ROUTING_REGISTRY.md'
      - 'CHAT_WINDOW_OWNERSHIP_LOCK.md'
      - 'WIC_OBSERVER_STATUS.md'
      - 'WIC_EXECUTION_STATE.json'
      - 'WIC_LIVE_OBSERVER_STATUS.md'
      - 'feedback_pipeline/**'
      - '.github/workflows/rule-governance-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate single source
        shell: bash
        run: |
          set -euo pipefail
          f='WIC_GLOBAL_OPERATING_RULES.md'
          test -s "$f"
          grep -q 'SINGLE SOURCE OF TRUTH' "$f"
          grep -q '운영 규칙은 이 파일 하나' "$f"
          grep -q '관찰자 모드' "$f"
          grep -q 'PASS / HOLD / FAIL' "$f"
          grep -q '껍데기 차단 규칙' "$f"
          grep -q '도구 번호별 단일 등록표' "$f"
          grep -q '사용자 부담 카운터' "$f"
          echo 'CENTRAL_RULES=PASS'
      - name: Validate auxiliary chat-governance files are non-normative
        shell: bash
        run: |
          set -euo pipefail
          r='WIC_CHAT_ROUTING_REGISTRY.md'
          o='CHAT_WINDOW_OWNERSHIP_LOCK.md'
          test -s "$r"
          test -s "$o"
          grep -q 'NON-NORMATIVE ROUTING LEDGER' "$r"
          grep -q '규범 원본: `WIC_GLOBAL_OPERATING_RULES.md`' "$r"
          grep -q 'NON-NORMATIVE COMPATIBILITY REFERENCE / EXECUTION SOURCE 아님' "$o"
          grep -q '규범 원본: `WIC_GLOBAL_OPERATING_RULES.md`' "$o"
          echo 'AUXILIARY_CHAT_GOVERNANCE=NON_NORMATIVE_PASS'
      - name: Validate legacy compatibility chat guards remain coherent during migration
        shell: bash
        run: |
          set -euo pipefail
          r='WIC_CHAT_ROUTING_REGISTRY.md'
          o='CHAT_WINDOW_OWNERSHIP_LOCK.md'
          grep -q 'NO_NEW_CHAT' "$r"
          grep -q 'EXPLICIT_NEW_CHAT_APPROVAL' "$r"
          grep -q 'FAIL-NO_NEW_CHAT-VIOLATION' "$r"
          grep -q 'CHAT IDENTITY VERIFICATION GATE' "$r"
          grep -q 'WORK_PREP | `워크 전 준비` | `UI_TITLE_HOLD`' "$r"
          grep -q 'CONTROL_PRIMARY | `(개발 관찰자 모드 유지) 지피티 도구` | `UI_TITLE_HOLD`' "$r"
          grep -q '대화창 생성은 사용자(관찰자)만 수행한다.' "$o"
          grep -q '대화창 이름은 사용자(관찰자)만 변경할 수 있다.' "$o"
          grep -q '무단 새 대화창 생성: FAIL' "$o"
          grep -q '무단 대화창 이름 변경 또는 다른 이름으로 취급: FAIL' "$o"
          echo 'LEGACY_CHAT_GUARD_COMPATIBILITY=PASS'
      - name: Reject unauthorized structure mutation fixtures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          forbidden = {
              'create_conversation',
              'rename_conversation',
              'create_preparation_chat',
              'create_observer_chat',
              'adopt_unverified_alias',
              'promote_logical_role_to_ui_title',
              'auto_move_to_new_chat',
          }

          def structure_gate(action, explicit_user_approval=False, direct_ui_title_evidence=False):
              if action == 'promote_logical_role_to_ui_title' and not direct_ui_title_evidence:
                  return 'UI_TITLE_HOLD'
              if action in forbidden and not explicit_user_approval:
                  return 'DENY_HOLD'
              return 'ALLOW'

          unauthorized = [
              'create_conversation',
              'rename_conversation',
              'create_preparation_chat',
              'create_observer_chat',
              'adopt_unverified_alias',
              'auto_move_to_new_chat',
          ]
          for action in unauthorized:
              result = structure_gate(action)
              assert result == 'DENY_HOLD', (action, result)

          assert structure_gate('promote_logical_role_to_ui_title') == 'UI_TITLE_HOLD'
          assert structure_gate('create_conversation', explicit_user_approval=True) == 'ALLOW'
          assert structure_gate(
              'promote_logical_role_to_ui_title',
              explicit_user_approval=True,
              direct_ui_title_evidence=True,
          ) == 'ALLOW'
          print('UNAUTHORIZED_STRUCTURE_PREFLIGHT=PASS')
          PY
      - name: Run deterministic integration and restart recovery fixtures
        shell: bash
        run: |
          set -euo pipefail
          python feedback_pipeline/cross_chat_feedback_ingest.py
          python feedback_pipeline/canonical_writer.py
          python feedback_pipeline/target_dispatcher.py
          python feedback_pipeline/restart_rollback_fixture.py
          python feedback_pipeline/cross_target_restart_e2e.py fail
          python feedback_pipeline/cross_target_restart_e2e.py restart
      - name: Validate public repository pointers
        shell: bash
        run: |
          set -euo pipefail
          repos=(
            01-auto-guide-v1
            02-auto-bid-narajangter-v1
            03-coding_practice
            05-report-generator
            06-toc-check
            07-wic-setting-tool-v1
            08-English-Verb-Exercise
            09-contents-making-tool
            10-WIC-Finance-Dashboard
            11-obk-finance-planner
            12-wic-subwebsite-builder
            13-excel-upload
            14-wic-homepage-editor
            19-wic-business-promotion
            21-Sales-Route-Planner
            22-Common-Item-kit
            23-world-advisor
            24-Easy-Video-Maker
            25-free-content-maker
            26-online-item-shop
            27-technical-book-verifier
          )
          fail=0
          for repo in "${repos[@]}"; do
            url="https://raw.githubusercontent.com/obk369369-spec/${repo}/main/WIC_RULE_SOURCE.md"
            if curl -fsSL "$url" | grep -q 'WIC_GLOBAL_OPERATING_RULES.md'; then
              echo "PASS ${repo}"
            else
              echo "FAIL ${repo}"
              fail=1
            fi
          done
          test "$fail" -eq 0
      - name: Private repository note
        run: |
          echo '04-research-funding-generator is private; pointer is verified through the connected GitHub tool, not public curl.'
          echo '15-18 have no dedicated GitHub repositories currently; central master keeps them HOLD.'
