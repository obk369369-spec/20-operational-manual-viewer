name: WIC Rule Governance Audit

on:
  push:
    paths:
      - 'WIC_GLOBAL_OPERATING_RULES.md'
      - 'WIC_CHAT_ROUTING_REGISTRY.md'
      - 'CHAT_WINDOW_OWNERSHIP_LOCK.md'
      - 'WIC_OBSERVER_STATUS.md'
      - 'WIC_EXECUTION_STATE.json'
      - 'WIC_LIVE_OBSERVER_STATUS.md'
      - 'feedback_pipeline/**'
      - '.github/workflows/rule-governance-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate single canonical source
        shell: bash
        run: |
          set -euo pipefail
          f='WIC_GLOBAL_OPERATING_RULES.md'
          test -s "$f"
          grep -q 'SINGLE SOURCE OF TRUTH' "$f"
          grep -q '운영 규칙은 이 파일 하나' "$f"
          grep -q '관찰자 모드' "$f"
          grep -q 'PASS / HOLD / FAIL' "$f"
          grep -q '무허가 작업·예약·대화창 생성' "$f"
          grep -q 'UI_TITLE_HOLD' "$f"
          grep -q '비규범 문서에는 새로운 실행 규칙' "$f"
          echo 'CENTRAL_RULES=PASS'

      - name: Validate registry is routing-only
        shell: bash
        run: |
          set -euo pipefail
          r='WIC_CHAT_ROUTING_REGISTRY.md'
          test -s "$r"
          grep -q 'NON-NORMATIVE ROUTING LEDGER' "$r"
          grep -q '규범 원본: `WIC_GLOBAL_OPERATING_RULES.md`' "$r"
          grep -q '^route: TOOL043 = ' "$r"
          grep -q '^route: CENTRAL = ' "$r"
          if grep -Eq '^### TOOL[0-9]+ .*DELTA|CRITICAL EXECUTION LOCK|FAIL-NO_NEW_CHAT-VIOLATION' "$r"; then
            echo 'FAIL-NON_NORMATIVE_RULE_DRIFT'
            exit 1
          fi
          python - <<'PY'
          from feedback_pipeline.cross_chat_feedback_ingest import load_route_registry
          routes = load_route_registry()
          assert 'CENTRAL' in routes and 'WORK_GATE' in routes and 'TOOL043' in routes
          assert len(routes) >= 9
          print('ROUTING_LEDGER=PASS')
          PY

      - name: Validate ownership file remains non-normative compatibility only
        shell: bash
        run: |
          set -euo pipefail
          o='CHAT_WINDOW_OWNERSHIP_LOCK.md'
          test -s "$o"
          grep -q 'NON-NORMATIVE COMPATIBILITY REFERENCE / EXECUTION SOURCE 아님' "$o"
          grep -q '규범 원본: `WIC_GLOBAL_OPERATING_RULES.md`' "$o"
          echo 'OWNERSHIP_COMPATIBILITY=PASS'

      - name: Reject unauthorized structure mutation fixtures
        shell: bash
        run: |
          set -euo pipefail
          python feedback_pipeline/unauthorized_structure_guard.py

      - name: Run deterministic integration and restart recovery fixtures
        shell: bash
        run: |
          set -euo pipefail
          python feedback_pipeline/cross_chat_feedback_ingest.py
          python feedback_pipeline/canonical_writer.py
          python feedback_pipeline/target_dispatcher.py
          python feedback_pipeline/restart_rollback_fixture.py
          python feedback_pipeline/cross_target_restart_e2e.py fail
          python feedback_pipeline/cross_target_restart_e2e.py restart

      - name: Validate public repository pointers
        shell: bash
        run: |
          set -euo pipefail
          repos=(
            01-auto-guide-v1
            02-auto-bid-narajangter-v1
            03-coding_practice
            05-report-generator
            06-toc-check
            07-wic-setting-tool-v1
            08-English-Verb-Exercise
            09-contents-making-tool
            10-WIC-Finance-Dashboard
            11-obk-finance-planner
            12-wic-subwebsite-builder
            13-excel-upload
            14-wic-homepage-editor
            19-wic-business-promotion
            21-Sales-Route-Planner
            22-Common-Item-kit
            23-world-advisor
            24-Easy-Video-Maker
            25-free-content-maker
            26-online-item-shop
            27-technical-book-verifier
          )
          fail=0
          for repo in "${repos[@]}"; do
            url="https://raw.githubusercontent.com/obk369369-spec/${repo}/main/WIC_RULE_SOURCE.md"
            if curl -fsSL "$url" | grep -q 'WIC_GLOBAL_OPERATING_RULES.md'; then
              echo "PASS ${repo}"
            else
              echo "FAIL ${repo}"
              fail=1
            fi
          done
          test "$fail" -eq 0

      - name: Private repository note
        run: |
          echo '04-research-funding-generator is private; pointer is verified through the connected GitHub tool, not public curl.'
          echo '15-18 have no dedicated GitHub repositories currently; central master keeps them HOLD.'
