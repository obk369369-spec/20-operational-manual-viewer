name: Deploy WIC Observer Dashboard
on:
  push:
    branches: [main]
    paths: ['observer/**', 'public/wic_observer_state.json', 'public/revenue-lab/**', '.github/workflows/wic-observer-pages.yml']
  workflow_run:
    workflows: ['WIC Top Controller Independent Runtime']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}observer/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce central admission and user stop for deploy
        env:
          WIC_USER_STOP: ${{ vars.WIC_USER_STOP }}
          WIC_RULE_ADMISSION_JSON: ${{ vars.WIC_RULE_ADMISSION_JSON }}
        run: python CONTROL_TOWER/controller/pre_work_admission.py --require-admission --work-id 'workflow:wic-observer-pages:deploy' --task-id CENTRAL
      - uses: actions/configure-pages@v5
      - name: Preserve existing pages and add observer dashboard
        run: |
          mkdir -p _site/tool020 _site/observer _site/revenue-lab _site/state
          cp -R tool043/. _site/
          cp public/index.html _site/tool020/index.html
          cp observer/index.html _site/observer/index.html
          cp public/wic_observer_state.json _site/state/current.json
          cp -R public/revenue-lab/. _site/revenue-lab/
      - uses: actions/upload-pages-artifact@v3
        with: {path: _site}
      - name: Verify independent closure before observer deployment
        env:
          WIC_CLOSURE_RECEIPTS_JSON: ${{ vars.WIC_CLOSURE_RECEIPTS_JSON }}
          WIC_USER_STOP: ${{ vars.WIC_USER_STOP }}
          WIC_RULE_ADMISSION_JSON: ${{ vars.WIC_RULE_ADMISSION_JSON }}
        run: python CONTROL_TOWER/controller/pre_work_admission.py --require-completion --work-id 'workflow:wic-observer-pages:deploy' --task-id CENTRAL
      - id: deployment
        uses: actions/deploy-pages@v4
