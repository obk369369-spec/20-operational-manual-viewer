name: TOOL045 Conversation Feedback Cloud Worker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tool045-cloud-worker
  cancel-in-progress: false

jobs:
  extract-and-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Run TOOL045 extraction
        run: python feedback_pipeline/tool045_worker.py
      - name: Persist TOOL045 state and TOOL016 handoff
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for path in \
            feedback_pipeline/tool045_state.json \
            feedback_pipeline/tool045_occurrences.jsonl \
            feedback_pipeline/tool045_tool016_handoff.json; do
            if [ -e "$path" ]; then git add -- "$path"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'tool045: persist extraction checkpoint'
          git pull --rebase origin main
          git push origin HEAD:main
