name: Cross-chat feedback pipeline audit

on:
  push:
    paths:
      - 'feedback_pipeline/**'
      - 'WIC_CHAT_ROUTING_REGISTRY.md'
      - 'WIC_FEEDBACK_REGRESSION_AND_WORK_GATE_LEDGER.md'
      - 'WIC_GLOBAL_OPERATING_RULES.md'
      - 'WIC_EXECUTION_STATE.json'
      - 'WIC_OBSERVER_STATUS.md'
      - '.github/workflows/cross-chat-feedback-audit.yml'
  pull_request:
    paths:
      - 'feedback_pipeline/**'
      - 'WIC_CHAT_ROUTING_REGISTRY.md'
      - 'WIC_FEEDBACK_REGRESSION_AND_WORK_GATE_LEDGER.md'
      - 'WIC_GLOBAL_OPERATING_RULES.md'
      - 'WIC_EXECUTION_STATE.json'
      - 'WIC_OBSERVER_STATUS.md'
      - '.github/workflows/cross-chat-feedback-audit.yml'

permissions:
  contents: read

jobs:
  deterministic-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic integration-core fixtures
        run: python feedback_pipeline/cross_chat_feedback_ingest.py
      - name: Run canonical mutation and read-back fixtures
        run: python feedback_pipeline/canonical_writer.py
      - name: Build and validate deterministic target dispatch plan
        run: python feedback_pipeline/target_dispatcher.py
      - name: Execute central lane ACKs and create evidence
        run: |
          python - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path('feedback_pipeline')
          manifest = json.loads((root/'target_apply_manifest.json').read_text(encoding='utf-8'))
          adapters = json.loads((root/'target_adapter_registry.json').read_text(encoding='utf-8'))
          required = ('EMAIL_DB','TOOL037','WORK_GATE')
          records = []
          for lane in required:
              target = manifest['targets'][lane]
              adapter = adapters['lane_targets'][lane]
              assert target['decision'] == 'APPLY_CHANGED_SCOPE'
              assert adapter['mode'] == 'CENTRAL_LANE_ACK'
              assert adapter['repository_required'] is False
              payload = {
                  'lane': lane,
                  'feedback_id': manifest['feedback_id'],
                  'canonical_revision': manifest['canonical_revision'],
                  'decision': target['decision'],
                  'apply_mode': adapter['mode'],
                  'evidence_contract': adapter['evidence'],
                  'status': 'APPLIED_ACK_TEST_PASS_INTERNAL_GITHUB'
              }
              raw = json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(',',':')).encode('utf-8')
              payload['ack_sha256'] = hashlib.sha256(raw).hexdigest()
              records.append(payload)
          result = {
              'schema_version': 1,
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
              'feedback_id': manifest['feedback_id'],
              'canonical_revision': manifest['canonical_revision'],
              'records': records,
              'failures': [],
              'result': 'PASS_INTERNAL_GITHUB',
              'external_independent_verification': False
          }
          (root/'lane_apply_evidence.json').write_text(json.dumps(result, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          assert {x['lane'] for x in records} == set(required)
          print('PASS: EMAIL_DB / TOOL037 / WORK_GATE central lane ACK execution + evidence')
          PY
      - name: Upload central lane ACK evidence
        uses: actions/upload-artifact@v4
        with:
          name: central-lane-ack-evidence
          path: feedback_pipeline/lane_apply_evidence.json
      - name: Validate collector and integration-core state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('feedback_pipeline/state.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['schema_version'] == 2
          assert data['pipeline_status'] == 'ACTIVE'
          assert data['normative_master'] == 'WIC_GLOBAL_OPERATING_RULES.md'
          ids = data.get('processed_feedback_ids', [])
          assert len(ids) == len(set(ids)), 'duplicate processed feedback ids'
          assert all(isinstance(x, str) and len(x) == 20 for x in ids)
          assert data['privacy']['persist_raw_customer_pii'] is False
          core = data['integration_core']
          expected_stages = [
              'EVENT', 'NORMALIZE', 'ROUTE_EXISTING_REGISTRY', 'CONFLICT_DEDUP',
              'CANONICAL_WRITE', 'READ_BACK', 'TARGET_REVISION_READ_APPLY',
              'TEST_EVIDENCE', 'RESTART_OR_HOLD'
          ]
          assert core['stage_order'] == expected_stages
          assert core['structure_pass'] is False
          assert set(core['module_contract_required']) == {
              'input_schema', 'output_schema', 'validate', 'apply',
              'rollback', 'fixture', 'evidence'
          }
          assert data['post_structure_priority'][:7] == [
              'email_collection', 'tool_7_customer_contact',
              'tool_1_intermediate_final_guide', 'metadata_37',
              'tool_13_excel_upload', 'tool_6_toc', 'tool_2_bid'
          ]
          plan = json.loads(Path('feedback_pipeline/target_dispatch_plan.json').read_text(encoding='utf-8'))
          action_targets = {x['target'] for x in plan['actions']}
          assert {'TOOL006', 'TOOL013', 'EMAIL_DB', 'TOOL037', 'WORK_GATE'}.issubset(action_targets)
          held_targets = {x['target'] for x in plan['holds']}
          assert {'TOOL001', 'TOOL002', 'TOOL007'}.issubset(held_targets)
          lane = json.loads(Path('feedback_pipeline/lane_apply_evidence.json').read_text(encoding='utf-8'))
          assert lane['result'] == 'PASS_INTERNAL_GITHUB'
          assert lane['failures'] == []
          assert {x['lane'] for x in lane['records']} == {'EMAIL_DB','TOOL037','WORK_GATE'}
          print('PASS: state schema + dedupe + privacy + integration-core contract + dispatcher + lane evidence')
          PY
