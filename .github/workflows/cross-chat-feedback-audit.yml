name: Cross-chat feedback pipeline audit

on:
  push:
    paths:
      - 'feedback_pipeline/**'
      - 'WIC_CHAT_ROUTING_REGISTRY.md'
      - 'WIC_FEEDBACK_REGRESSION_AND_WORK_GATE_LEDGER.md'
      - 'WIC_GLOBAL_OPERATING_RULES.md'
      - 'WIC_EXECUTION_STATE.json'
      - 'WIC_OBSERVER_STATUS.md'
      - '.github/workflows/cross-chat-feedback-audit.yml'
  pull_request:
    paths:
      - 'feedback_pipeline/**'
      - 'WIC_CHAT_ROUTING_REGISTRY.md'
      - 'WIC_FEEDBACK_REGRESSION_AND_WORK_GATE_LEDGER.md'
      - 'WIC_GLOBAL_OPERATING_RULES.md'
      - 'WIC_EXECUTION_STATE.json'
      - 'WIC_OBSERVER_STATUS.md'
      - '.github/workflows/cross-chat-feedback-audit.yml'

permissions:
  contents: read

jobs:
  deterministic-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run deterministic integration-core fixtures
        run: python feedback_pipeline/cross_chat_feedback_ingest.py
      - name: Run canonical mutation and read-back fixtures
        run: python feedback_pipeline/canonical_writer.py
      - name: Build and validate deterministic target dispatch plan
        run: python feedback_pipeline/target_dispatcher.py
      - name: Validate collector and integration-core state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('feedback_pipeline/state.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['schema_version'] == 2
          assert data['pipeline_status'] == 'ACTIVE'
          assert data['normative_master'] == 'WIC_GLOBAL_OPERATING_RULES.md'
          ids = data.get('processed_feedback_ids', [])
          assert len(ids) == len(set(ids)), 'duplicate processed feedback ids'
          assert all(isinstance(x, str) and len(x) == 20 for x in ids)
          assert data['privacy']['persist_raw_customer_pii'] is False
          core = data['integration_core']
          expected_stages = [
              'EVENT', 'NORMALIZE', 'ROUTE_EXISTING_REGISTRY', 'CONFLICT_DEDUP',
              'CANONICAL_WRITE', 'READ_BACK', 'TARGET_REVISION_READ_APPLY',
              'TEST_EVIDENCE', 'RESTART_OR_HOLD'
          ]
          assert core['stage_order'] == expected_stages
          assert core['structure_pass'] is False
          assert set(core['module_contract_required']) == {
              'input_schema', 'output_schema', 'validate', 'apply',
              'rollback', 'fixture', 'evidence'
          }
          assert data['post_structure_priority'][:7] == [
              'email_collection', 'tool_7_customer_contact',
              'tool_1_intermediate_final_guide', 'metadata_37',
              'tool_13_excel_upload', 'tool_6_toc', 'tool_2_bid'
          ]
          plan = json.loads(Path('feedback_pipeline/target_dispatch_plan.json').read_text(encoding='utf-8'))
          action_targets = {x['target'] for x in plan['actions']}
          assert {'TOOL006', 'TOOL013', 'EMAIL_DB', 'TOOL037', 'WORK_GATE'}.issubset(action_targets)
          held_targets = {x['target'] for x in plan['holds']}
          assert {'TOOL001', 'TOOL002', 'TOOL007'}.issubset(held_targets)
          print('PASS: state schema + dedupe + privacy + integration-core contract + dispatcher plan')
          PY
