name: Cross-chat feedback pipeline audit

on:
  push:
    paths:
      - 'feedback_pipeline/**'
      - 'customer_pipeline/**'
      - 'WIC_CHAT_ROUTING_REGISTRY.md'
      - 'WIC_FEEDBACK_REGRESSION_AND_WORK_GATE_LEDGER.md'
      - 'WIC_GLOBAL_OPERATING_RULES.md'
      - '.github/workflows/cross-chat-feedback-audit.yml'
  pull_request:
    paths:
      - 'feedback_pipeline/**'
      - 'customer_pipeline/**'
      - 'WIC_CHAT_ROUTING_REGISTRY.md'
      - 'WIC_FEEDBACK_REGRESSION_AND_WORK_GATE_LEDGER.md'
      - 'WIC_GLOBAL_OPERATING_RULES.md'
      - '.github/workflows/cross-chat-feedback-audit.yml'

permissions:
  contents: read

jobs:
  deterministic-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deny structural changes without explicit user-directive provenance
        run: python feedback_pipeline/unauthorized_structure_guard.py
      - name: Run deterministic integration-core fixtures
        run: python feedback_pipeline/cross_chat_feedback_ingest.py
      - name: Run automatic Work-16 candidate fixtures
        run: python feedback_pipeline/work_ready_tracker.py
      - name: Run canonical mutation and read-back fixtures
        run: python feedback_pipeline/canonical_writer.py
      - name: Build and validate revision-aware target dispatch plan
        run: python feedback_pipeline/target_dispatcher.py
      - name: Execute TOOL007 purpose-matching central adapter fixture
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from customer_pipeline.tool7_contact_judgment import judge_contact, recommendation_gate, run_fixtures

          fixture_result = run_fixtures()
          probes = {
              'unverified_employment': judge_contact({
                  'current_employment_verified': False,
                  'company_direction_verified': True
              }),
              'explicit_stop': judge_contact({
                  'current_employment_verified': True,
                  'company_direction_verified': True,
                  'explicit_stop_or_rejection': True
              }),
              'material_first': judge_contact({
                  'current_employment_verified': True,
                  'company_direction_verified': True,
                  'research_or_enterprise_customer': True,
                  'direct_inquiry': True
              }),
              'missing_report_link': recommendation_gate({
                  'title': 'T', 'publisher': 'P', 'publication_date': '2026-08',
                  'link': '', 'paid': True, 'tradable': True
              })
          }
          assert fixture_result == 'PASS: 8 deterministic P2 fixtures'
          assert probes['unverified_employment']['decision'] == 'HOLD'
          assert probes['explicit_stop']['decision'] == 'FAIL'
          assert probes['material_first']['channel'] == 'MATERIAL_FIRST'
          assert probes['missing_report_link']['state'] == 'HOLD'
          evidence = {
              'schema_version': 1,
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
              'target': 'TOOL007',
              'adapter': 'customer_pipeline/tool7_contact_judgment.py',
              'fixture_result': fixture_result,
              'probes': probes,
              'result': 'PASS_INTERNAL_GITHUB_RUN',
              'external_independent_verification': False
          }
          Path('feedback_pipeline/tool007_adapter_evidence.json').write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print('PASS: TOOL007 purpose-matching central adapter actual GitHub execution')
          PY
      - name: Run controlled rollback and restart checkpoint fixture
        run: python feedback_pipeline/restart_rollback_fixture.py
      - name: Run actual cross-target controlled failure and rollback
        run: python feedback_pipeline/cross_target_restart_e2e.py fail
      - name: Restart automatically from persisted last_success_stage checkpoint
        run: python feedback_pipeline/cross_target_restart_e2e.py restart
      - name: Execute central lane ACKs and create evidence
        run: |
          python - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path('feedback_pipeline')
          manifest = json.loads((root/'target_apply_manifest.json').read_text(encoding='utf-8'))
          adapters = json.loads((root/'target_adapter_registry.json').read_text(encoding='utf-8'))
          required = tuple(
              lane for lane in manifest.get('targets', {})
              if lane in adapters.get('lane_targets', {})
          )
          records = []
          for lane in required:
              target = manifest['targets'][lane]
              adapter = adapters['lane_targets'][lane]
              assert target['decision'] == 'APPLY_CHANGED_SCOPE'
              assert adapter['mode'] == 'CENTRAL_LANE_ACK'
              assert adapter['repository_required'] is False
              payload = {
                  'lane': lane,
                  'feedback_id': manifest['feedback_id'],
                  'canonical_revision': manifest['canonical_revision'],
                  'decision': target['decision'],
                  'apply_mode': adapter['mode'],
                  'evidence_contract': adapter['evidence'],
                  'status': 'APPLIED_ACK_TEST_PASS_INTERNAL_GITHUB'
              }
              raw = json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(',',':')).encode('utf-8')
              payload['ack_sha256'] = hashlib.sha256(raw).hexdigest()
              records.append(payload)
          result = {
              'schema_version': 1,
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
              'feedback_id': manifest['feedback_id'],
              'canonical_revision': manifest['canonical_revision'],
              'records': records,
              'failures': [],
              'result': 'PASS_INTERNAL_GITHUB',
              'external_independent_verification': False
          }
          (root/'lane_apply_evidence.json').write_text(json.dumps(result, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          assert {x['lane'] for x in records} == set(required)
          print('PASS: manifest-scoped central lane ACK execution + evidence')
          PY
      - name: Upload integration-core evidence
        uses: actions/upload-artifact@v4
        with:
          name: integration-core-evidence
          path: |
            feedback_pipeline/unauthorized_structure_guard_evidence.json
            feedback_pipeline/lane_apply_evidence.json
            feedback_pipeline/tool007_adapter_evidence.json
            feedback_pipeline/restart_rollback_evidence.json
            feedback_pipeline/cross_target_restart_e2e_evidence.json
            feedback_pipeline/target_dispatch_plan.json
      - name: Validate collector and integration-core state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('feedback_pipeline/state.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['schema_version'] == 2
          assert data['pipeline_status'] == 'ACTIVE'
          assert data['normative_master'] == 'WIC_GLOBAL_OPERATING_RULES.md'
          ids = data.get('processed_feedback_ids', [])
          assert len(ids) == len(set(ids)), 'duplicate processed feedback ids'
          assert all(isinstance(x, str) and len(x) == 20 for x in ids)
          assert data['privacy']['persist_raw_customer_pii'] is False
          core = data['integration_core']
          manifest = json.loads(Path('feedback_pipeline/target_apply_manifest.json').read_text(encoding='utf-8'))
          adapters = json.loads(Path('feedback_pipeline/target_adapter_registry.json').read_text(encoding='utf-8'))
          expected_stages = [
              'EVENT', 'NORMALIZE', 'ROUTE_EXISTING_REGISTRY', 'CONFLICT_DEDUP',
              'CANONICAL_WRITE', 'READ_BACK', 'TARGET_REVISION_READ_APPLY',
              'TEST_EVIDENCE', 'RESTART_OR_HOLD'
          ]
          assert core['stage_order'] == expected_stages
          expected_structure_pass = set(manifest.get('targets', {})) <= set(adapters.get('lane_targets', {}))
          assert core['structure_pass'] is expected_structure_pass
          assert core['feedback_checkpoints']['f2aeb4e8f5fac3c9618f']['status'] == 'PASS_INTERNAL_GITHUB_E2E'
          assert core['holds'] == []
          assert set(core['module_contract_required']) == {
              'input_schema', 'output_schema', 'validate', 'apply',
              'rollback', 'fixture', 'evidence'
          }
          assert data['post_structure_priority'][:7] == [
              'email_collection', 'tool_7_customer_contact',
              'tool_1_intermediate_final_guide', 'metadata_37',
              'tool_13_excel_upload', 'tool_6_toc', 'tool_2_bid'
          ]
          plan = json.loads(Path('feedback_pipeline/target_dispatch_plan.json').read_text(encoding='utf-8'))
          by_target = {x['target']: x for x in plan['actions']}
          assert set(by_target) == set(manifest.get('targets', {}))
          for target, action in by_target.items():
              expected_action = 'LANE_ACK' if target in adapters.get('lane_targets', {}) else 'REPOSITORY_REVISION_ACK'
              assert action['action'] == expected_action
          assert plan['holds'] == []
          lane = json.loads(Path('feedback_pipeline/lane_apply_evidence.json').read_text(encoding='utf-8'))
          assert lane['result'] == 'PASS_INTERNAL_GITHUB'
          assert lane['failures'] == []
          expected_lanes = {
              target for target in manifest.get('targets', {})
              if target in adapters.get('lane_targets', {})
          }
          assert {x['lane'] for x in lane['records']} == expected_lanes
          tool7 = json.loads(Path('feedback_pipeline/tool007_adapter_evidence.json').read_text(encoding='utf-8'))
          assert tool7['target'] == 'TOOL007'
          assert tool7['result'] == 'PASS_INTERNAL_GITHUB_RUN'
          guard = json.loads(Path('feedback_pipeline/unauthorized_structure_guard_evidence.json').read_text(encoding='utf-8'))
          assert guard['guard'] == 'UNAUTHORIZED_CHANGE_GUARD'
          assert guard['result'] == 'PASS_INTERNAL_FIXTURE'
          assert guard['cases']['missing_provenance']['decision'] == 'DENY_HOLD'
          assert guard['cases']['unauthorized_chat']['decision'] == 'DENY_HOLD'
          assert guard['cases']['unauthorized_rename']['decision'] == 'DENY_HOLD'
          assert guard['cases']['unauthorized_schedule']['decision'] == 'DENY_HOLD'
          assert guard['cases']['unauthorized_automation_enable']['decision'] == 'DENY_HOLD'
          assert guard['cases']['unauthorized_work']['decision'] == 'DENY_HOLD'
          assert set(guard['unrequested_mutation_counts'].values()) == {0}
          assert guard['cases']['unauthorized_tool']['decision'] == 'DENY_HOLD'
          assert guard['cases']['unauthorized_program']['decision'] == 'DENY_HOLD'
          assert guard['cases']['negative_rename']['decision'] == 'DENY_HOLD'
          assert guard['cases']['negative_registry']['decision'] == 'DENY_HOLD'
          assert guard['cases']['approved_chat']['decision'] == 'ALLOW'
          assert guard['cases']['approved_tool']['decision'] == 'ALLOW'
          assert guard['cases']['approved_program']['decision'] == 'ALLOW'
          rr = json.loads(Path('feedback_pipeline/restart_rollback_evidence.json').read_text(encoding='utf-8'))
          assert rr['result'] == 'PASS_INTERNAL_FIXTURE'
          assert rr['after']['restart_from_stage'] == 'TARGET_REVISION_READ_APPLY'
          actual = json.loads(Path('feedback_pipeline/cross_target_restart_e2e_evidence.json').read_text(encoding='utf-8'))
          assert actual['result'] == 'PASS_INTERNAL_GITHUB_RUN'
          assert actual['checkpoint_read'] is True
          assert actual['restart_from_stage'] == 'TARGET_REVISION_READ_APPLY'
          assert actual['readback_match'] is True
          assert actual['target_clean_after_e2e'] is True
          assert actual['executed_after_restart'] == ['TARGET_REVISION_READ_APPLY','TEST_EVIDENCE','RESTART_OR_HOLD']
          print('PASS: actual feedback structure + unauthorized guard + revision ACK + central lanes + rollback/restart E2E')
          PY
