name: WIC Parallel Boundary Admission Delta

on:
  push:
    paths:
      - 'CONTROL_TOWER/controller/pre_work_admission.py'
      - 'CONTROL_TOWER/controller/runtime_progress_gate.py'
      - '.github/workflows/tool044-multi-gate.yml'
      - '.github/workflows/tool016-tool044-expansion-fault-loop.yml'
      - '.github/workflows/tool044-registered-target-deploy-validation.yml'
      - '.github/workflows/wic-observer-pages.yml'
      - '.github/workflows/wic-external-boundary-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changed-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify per-job admission, user stop and closure promotion
        run: |
          python - <<'PY'
          import hashlib, json, os, sys, tempfile
          from pathlib import Path
          root = Path.cwd()
          sys.path.insert(0, str(root / 'CONTROL_TOWER' / 'controller'))
          import pre_work_admission as gate
          from runtime_progress_gate import canonical_rule_manifest
          work_id, task_id = 'workflow:tool044-multi-gate:lane:TEST_JOB', 'TOOL042'
          context = canonical_rule_manifest(root, task_id)
          assert not context['missing'], context
          context.update(conflicts=[], source_records_verified=True)
          with tempfile.NamedTemporaryFile(mode='w', suffix='.json', dir=root / 'feedback_pipeline' / 'evidence',
                                           encoding='utf-8', delete=False) as source_file:
              json.dump({'work_id':work_id,'task_id':task_id,'source_records_verified':True,
                         'validation_result':'PASS','validator_id':'INDEPENDENT_DELTA',
                         'source_refs':['ISOLATED_SOURCE']}, source_file)
              source = Path(source_file.name)
          with tempfile.NamedTemporaryFile(mode='w', suffix='.json', dir=root / 'feedback_pipeline' / 'evidence',
                                           encoding='utf-8', delete=False) as closure_file:
              json.dump({'work_id':work_id,'task_id':task_id,'execution_id':'ISOLATED_EXECUTION','run_id':os.environ.get('GITHUB_RUN_ID'),
                         'independent_validator_id':'INDEPENDENT_DELTA',
                         'actual_input':'fixture','actual_output':'MATCH','expected_output':'MATCH',
                         'validation_pass':True,'positive_pass':True,'negative_pass':True,
                         'failure_injection_pass':True,'recovery_pass':True,'rollback_pass':True,
                         'evidence_ref':'ISOLATED_EVIDENCE','readback_pass':True}, closure_file)
              closure = Path(closure_file.name)
          try:
              admission = {'work_id':work_id,'task_id':task_id,'rule_context':context,
                           'source_receipt':{'path':source.relative_to(root).as_posix(),
                                             'sha256':hashlib.sha256(source.read_bytes()).hexdigest()}}
              os.environ['WIC_RULE_ADMISSION_JSON'] = json.dumps({'admissions':{work_id:admission}})
              os.environ['WIC_USER_STOP'] = '1'
              assert gate.require_external_admission(work_id, task_id)['reason'] == 'USER_STOP_OR_START_BLOCKED'
              os.environ['WIC_USER_STOP'] = '0'
              assert gate.require_external_admission(work_id, task_id)['decision'] == 'ALLOW'
              assert gate.require_external_admission(work_id + ':OTHER', task_id)['decision'] == 'BLOCK'
              assert gate.require_external_admission(work_id, 'TOOL044')['reason'] == 'TASK_RULE_SOURCE_UNMAPPED'
              assert gate.require_external_completion(work_id, task_id)['decision'] == 'BLOCK'
              ref = {'path':closure.relative_to(root).as_posix(),
                     'sha256':hashlib.sha256(closure.read_bytes()).hexdigest()}
              os.environ['WIC_CLOSURE_RECEIPTS_JSON'] = json.dumps({work_id:ref})
              assert gate.require_external_completion(work_id, task_id)['decision'] == 'ALLOW'
              os.environ['WIC_CLOSURE_RECEIPTS_JSON'] = json.dumps({work_id:dict(ref,sha256='bad')})
              assert gate.require_external_completion(work_id, task_id)['reason'] == 'CLOSURE_RECEIPT_STALE_OR_TAMPERED'
              paths = {
                  'tool044-multi-gate.yml':(3,2),
                  'tool016-tool044-expansion-fault-loop.yml':(4,3),
                  'tool044-registered-target-deploy-validation.yml':(1,1),
                  'wic-observer-pages.yml':(1,1),
              }
              for name,(starts,closures) in paths.items():
                  text = (root/'.github'/'workflows'/name).read_text()
                  assert text.count('--require-admission') == starts, name
                  assert text.count('--require-completion') == closures, name
                  assert text.count('WIC_USER_STOP: ${{ vars.WIC_USER_STOP }}') == starts, name
          finally:
              source.unlink()
              closure.unlink()
          print('PASS PARALLEL_PER_JOB_ADMISSION_USER_STOP_AND_CLOSURE_DELTA')
          PY
