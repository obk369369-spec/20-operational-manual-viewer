name: WIC Common Mutating Boundary Delta

on:
  push:
    paths:
      - 'WIC_GLOBAL_OPERATING_RULES.md'
      - 'CONTROL_TOWER/controller/runtime_progress_gate.py'
      - 'CONTROL_TOWER/controller/pre_work_admission.py'
      - 'observer/index.html'
      - '.github/workflows/render-env2-roundtrip.yml'
      - '.github/workflows/root-a-env1-circleci-readback.yml'
      - '.github/workflows/root-a-fault-e2e.yml'
      - '.github/workflows/root-a-recovery-supervisor.yml'
      - '.github/workflows/tool044-cloud-worker.yml'
      - '.github/workflows/wic-external-development-structure-probe.yml'
      - '.github/workflows/wic-feedback-event.yml'
      - '.github/workflows/wic-github-issue-ingress.yml'
      - '.github/workflows/wic-stall-monitor.yml'
      - '.github/workflows/wic-top-controller-runtime.yml'
      - '.github/workflows/wic-external-boundary-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changed-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify only new common admission bindings and fail-closed default
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path.cwd() / 'CONTROL_TOWER' / 'controller'))
          from pre_work_admission import require_external_admission
          paths = json.loads("{\"render-env2-roundtrip.yml\":{\"issue-job\":\"Persist issued identity before external execution\"},\"root-a-env1-circleci-readback.yml\":{\"readback\":\"Read CircleCI result from GitHub commit status\"},\"root-a-fault-e2e.yml\":{\"env1_fault\":\"mkdir -p /tmp/root-a\",\"watchdog_handoff\":\"actions/download-artifact@v4\",\"final_readback\":\"HANDOFF_SHA\"},\"root-a-recovery-supervisor.yml\":{\"supervise\":\"Inspect primary TOOL044 worker\"},\"tool044-cloud-worker.yml\":{\"public-safe-worker\":\"Contract and restart-resume test\",\"isolated-central-return\":\"Restore previous isolated state\"},\"wic-external-development-structure-probe.yml\":{\"verify-release-rollback\":\"Baseline health and requirements lock\"},\"wic-feedback-event.yml\":{\"apply-feedback\":\"Materialize authenticated event\",\"receive-render-env2\":\"Validate identity, reject stale\"},\"wic-github-issue-ingress.yml\":{\"dispatch-wic-feedback\":\"Normalize real GitHub issue\"},\"wic-stall-monitor.yml\":{\"watchdog\":\"TOOL044 watchdog\"},\"wic-top-controller-runtime.yml\":{\"controller-cycle\":\"Provide existing reconciler repository path\"}}")
          for filename, jobs in paths.items():
              text = (Path('.github/workflows') / filename).read_text(encoding='utf-8')
              for job, first_effect in jobs.items():
                  match = re.search(r'(?m)^  ' + re.escape(job) + r':\s*$', text)
                  assert match, (filename, job, 'JOB_MISSING')
                  tail = text[match.end():]
                  next_job = re.search(r'(?m)^  [A-Za-z0-9_-]+:\s*$', tail)
                  body = tail[:next_job.start()] if next_job else tail
                  identity = 'workflow:' + filename[:-4] + ':' + job
                  gate = body.find('pre_work_admission.py --require-admission --work-id ' + chr(39) + identity + chr(39))
                  first = body.find(first_effect)
                  assert gate >= 0 and first > gate, (filename, job, 'ADMISSION_NOT_BEFORE_EFFECT')
                  assert 'WIC_USER_STOP: ${{ vars.WIC_USER_STOP }}' in body, (filename, job, 'USER_STOP_NOT_BOUND')
                  assert 'WIC_RULE_ADMISSION_JSON: ${{ vars.WIC_RULE_ADMISSION_JSON }}' in body, (filename, job, 'RULE_ADMISSION_NOT_BOUND')
          assert '## 2026-10-20 관찰자·중앙 실행허가 우선 규칙' in Path('WIC_GLOBAL_OPERATING_RULES.md').read_text(encoding='utf-8')
          os.environ.pop('WIC_USER_STOP', None)
          os.environ.pop('WIC_RULE_ADMISSION_JSON', None)
          assert require_external_admission('workflow:wic-top-controller-runtime:controller-cycle', 'CENTRAL')['reason'] == 'USER_STOP_OR_START_BLOCKED'
          os.environ['WIC_USER_STOP'] = '0'
          assert require_external_admission('workflow:wic-top-controller-runtime:controller-cycle', 'CENTRAL')['decision'] == 'BLOCK'
          from runtime_progress_gate import canonical_rule_manifest, verify_work_admission
          for task_id, rule_path in (('TOOL016', 'feedback_pipeline/TOOL016_MASTER.md'),
                                     ('TOOL044', 'feedback_pipeline/TOOL044_MASTER.md')):
              manifest = canonical_rule_manifest(Path.cwd(), task_id)
              assert rule_path in manifest['files'] and not manifest['missing'], (task_id, manifest)
              assert verify_work_admission(None, repo_root=Path.cwd(), work_id='ISOLATED', task_id=task_id)['decision'] == 'BLOCK'
          assert verify_work_admission(None, repo_root=Path.cwd(), work_id='ISOLATED', task_id='TOOL043')['reason'] == 'TASK_RULE_SOURCE_UNMAPPED'
          import subprocess, tempfile
          html = Path('observer/index.html').read_text(encoding='utf-8')
          assert 'const GATE=' in html and 'gate.start_blocked?' in html
          assert '중앙 Gate 확인 불가 — 완료로 판단하지 않습니다.' in html
          script = html.split('<script>', 1)[1].split('</script>', 1)[0]
          with tempfile.TemporaryDirectory() as folder:
              target = Path(folder) / 'observer.js'
              target.write_text(script, encoding='utf-8')
              subprocess.run(['node', '--check', str(target)], check=True)
          import hashlib
          import sys
          from runtime_progress_gate import canonical_rule_manifest
          work_id, task_id = 'workflow:tool044-cloud-worker:public-safe-worker', 'TOOL044'
          with tempfile.TemporaryDirectory(dir=Path('feedback_pipeline/evidence')) as folder:
              source = (Path(folder) / 'source.json').resolve()
              marker_path = (Path(folder) / 'isolated-execution.txt').resolve()
              closure = (Path(folder) / 'closure.json').resolve()
              independent = (Path(folder) / 'independent.json').resolve()
              original = (Path(folder) / 'original.txt').resolve()
              original.write_text('ISOLATED_SOURCE\n', encoding='utf-8')
              context = canonical_rule_manifest(Path.cwd(), task_id)
              source.write_text(json.dumps({'work_id':work_id,'task_id':task_id,'source_records_verified':True,
                                            'validation_result':'PASS','validator_id':'ISOLATED_VALIDATOR',
                                            'rule_version':context['version'],
                                            'validation_plan':{'method':'exact-result-and-rule-check',
                                                               'expected_result':'MATCH',
                                                               'evidence_required':'original, result, independent validation, readback'},
                                            'source_refs':[{'path':original.relative_to(Path.cwd()).as_posix(),
                                                            'sha256':hashlib.sha256(original.read_bytes()).hexdigest()}]}) + '\n', encoding='utf-8')
              assert not context['missing']
              context.update(conflicts=[], source_records_verified=True)
              admission = {'work_id':work_id,'task_id':task_id,'rule_context':context,
                           'source_receipt':{'path':source.relative_to(Path.cwd()).as_posix(),
                                             'sha256':hashlib.sha256(source.read_bytes()).hexdigest()}}
              env = dict(os.environ, WIC_RULE_ADMISSION_JSON=json.dumps({'admissions':{work_id:admission}}),
                         WIC_USER_STOP='1')
              cmd = [sys.executable, 'CONTROL_TOWER/controller/pre_work_admission.py',
                     '--require-admission','--work-id',work_id,'--task-id',task_id]
              stopped = subprocess.run(cmd, env=env, capture_output=True, text=True)
              assert stopped.returncode == 1 and 'USER_STOP_OR_START_BLOCKED' in stopped.stdout
              assert not marker_path.exists()
              env['WIC_USER_STOP'] = '0'
              allowed = subprocess.run(cmd, env=env, capture_output=True, text=True)
              assert allowed.returncode == 0 and 'ALLOW' in allowed.stdout, allowed.stdout
              marker_path.write_text('ACTUAL_ISOLATED_EXECUTION\n', encoding='utf-8')
              assert marker_path.read_text(encoding='utf-8') == 'ACTUAL_ISOLATED_EXECUTION\n'
              result_ref = {'path':marker_path.relative_to(Path.cwd()).as_posix(),
                            'sha256':hashlib.sha256(marker_path.read_bytes()).hexdigest()}
              independent.write_text(json.dumps({'work_id':work_id,'task_id':task_id,
                  'validator_id':'ISOLATED_VALIDATOR','execution_id':'ISOLATED_EXECUTION',
                  'actual_result_sha256':result_ref['sha256'],'rule_version':context['version'],
                  'source_receipt_sha256':admission['source_receipt']['sha256'],
                  'rule_compliance_verdict':'PASS','validation_result':'PASS'}) + '\n', encoding='utf-8')
              independent_ref = {'path':independent.relative_to(Path.cwd()).as_posix(),
                                 'sha256':hashlib.sha256(independent.read_bytes()).hexdigest()}
              receipt = {'work_id':work_id,'task_id':task_id,'execution_id':'ISOLATED_EXECUTION',
                         'applied_rule_version':context['version'],
                         'source_receipt_sha256':admission['source_receipt']['sha256'],
                         'source_receipt_ref':dict(admission['source_receipt']),
                         'rule_compliance_verdict':'PASS','actual_result_ref':result_ref,
                         'independent_validation_ref':independent_ref,'remote_readback_ref':result_ref,
                         'run_id':os.environ['GITHUB_RUN_ID'],'independent_validator_id':'ISOLATED_VALIDATOR',
                         'actual_input':'fixture','actual_output':'MATCH','expected_output':'MATCH',
                         'validation_pass':True,'positive_pass':True,'negative_pass':True,
                         'failure_injection_pass':True,'recovery_pass':True,'rollback_pass':True,
                         'evidence_ref':str(marker_path),'readback_pass':True}
              closure.write_text(json.dumps(receipt) + '\n', encoding='utf-8')
              env['WIC_CLOSURE_RECEIPTS_JSON'] = json.dumps({work_id:{
                  'path':closure.relative_to(Path.cwd()).as_posix(),
                  'sha256':hashlib.sha256(closure.read_bytes()).hexdigest()}})
              completed = subprocess.run([sys.executable,'CONTROL_TOWER/controller/pre_work_admission.py',
                                          '--require-completion','--work-id',work_id,'--task-id',task_id],
                                         env=env,capture_output=True,text=True)
              assert completed.returncode == 0 and 'ALLOW' in completed.stdout, completed.stdout
              tampered = dict(receipt, rule_compliance_verdict='FAIL')
              closure.write_text(json.dumps(tampered) + '\n', encoding='utf-8')
              env['WIC_CLOSURE_RECEIPTS_JSON'] = json.dumps({work_id:{
                  'path':closure.relative_to(Path.cwd()).as_posix(),
                  'sha256':hashlib.sha256(closure.read_bytes()).hexdigest()}})
              rejected = subprocess.run([sys.executable,'CONTROL_TOWER/controller/pre_work_admission.py',
                                         '--require-completion','--work-id',work_id,'--task-id',task_id],
                                        env=env,capture_output=True,text=True)
              assert rejected.returncode == 1 and 'CLOSURE_SOURCE_OR_RULE_COMPLIANCE_UNVERIFIED' in rejected.stdout
              source.write_text(json.dumps({'work_id':work_id,'task_id':task_id,
                  'source_records_verified':True,'validation_result':'PASS',
                  'validator_id':'ISOLATED_VALIDATOR','rule_version':context['version'],
                  'validation_plan':{'method':'exact-result-and-rule-check','expected_result':'MATCH',
                  'evidence_required':'original, result, independent validation, readback'},
                  'source_refs':[{'path':'missing/original.txt','sha256':'0'*64}]}) + '\n', encoding='utf-8')
              admission['source_receipt']['sha256'] = hashlib.sha256(source.read_bytes()).hexdigest()
              env['WIC_RULE_ADMISSION_JSON'] = json.dumps({'admissions':{work_id:admission}})
              rejected_start = subprocess.run(cmd, env=env,capture_output=True,text=True)
              assert rejected_start.returncode == 1 and 'ORIGINAL_SOURCE_MISSING_OR_CHANGED' in rejected_start.stdout
          print('PASS ISOLATED_REMOTE_STOP_REAUTHORIZE_EXECUTE_COMPLETE')
          print('PASS COMMON_MUTATING_BOUNDARY_AND_OBSERVER_DELTA', sum(map(len, paths.values())))
          PY
