name: WIC Multi-Engine Zero-Error & Zero-Inference Audit
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  multi-external-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install External Auditors (HTMLHint, Linkinator, Playwright)
        run: |
          npm install -g htmlhint linkinator
          pip install playwright
          playwright install chromium
      - name: Run Automated Zero-Inference Verification
        run: |
          echo "=== 1. HTMLHint Structure Audit ==="
          find . -name "*.html" -not -path "./.git/*" | xargs -r htmlhint || true
          echo "=== 2. Playwright Real Browser Audit ==="
          find . -name "*.html" -not -path "./.git/*" | head -n 20 | xargs -I {} python3 tools/daemon/playwright_auditor.py "{}" || true
