name: WIC Hourly Free Status Report

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: wic-hourly-free-status-report
  cancel-in-progress: true

jobs:
  hourly-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Build hourly status snapshot from existing evidence
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('feedback_pipeline')
          evidence_dir = root / 'evidence'
          out_dir = Path('observer') / 'runtime'
          out_dir.mkdir(parents=True, exist_ok=True)

          def read_json(path):
              try:
                  return json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  return None

          production = read_json(evidence_dir / 'tool044_production_loop.json') or {}
          queue = read_json(root / 'tool044_atomic_demand_queue.json') or {}
          demands = queue.get('demands', [])
          counts = {}
          for d in demands:
              s = str(d.get('status', 'UNKNOWN'))
              counts[s] = counts.get(s, 0) + 1

          latest_checkpoint = None
          latest_evidence = None
          files = [p for p in evidence_dir.rglob('*') if p.is_file()]
          if files:
              latest = max(files, key=lambda p: p.stat().st_mtime)
              latest_evidence = str(latest)

          checkpoint_candidates = [p for p in root.rglob('*checkpoint*') if p.is_file()]
          if checkpoint_candidates:
              latest_checkpoint = str(max(checkpoint_candidates, key=lambda p: p.stat().st_mtime))

          report = {
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
              'source': 'FREE_GITHUB_ACTIONS_NO_CHATGPT_CODEX_WORK_SCHEDULE',
              'production_loop_status': production.get('results', [{}])[-1].get('status') if production.get('results') else production.get('status'),
              'production_run_id': production.get('run_id'),
              'queue_status_counts': counts,
              'latest_evidence': latest_evidence,
              'latest_checkpoint': latest_checkpoint,
              'automatic_next_task_claim': production.get('automatic_next_task_claim'),
              'user_manual_relay_required': production.get('user_manual_relay_required'),
          }
          (out_dir / 'hourly-status.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          with (out_dir / 'hourly-status-history.jsonl').open('a', encoding='utf-8') as f:
              f.write(json.dumps(report, ensure_ascii=False, separators=(',', ':')) + '\n')
          print(json.dumps(report, ensure_ascii=False))
          PY
      - name: Persist hourly status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add observer/runtime/hourly-status.json observer/runtime/hourly-status-history.jsonl observer/runtime/hourly-report-ko.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'observer: record hourly free runtime status'
          git pull --rebase origin main
          git push origin HEAD:main
