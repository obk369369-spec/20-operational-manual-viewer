name: WIC Hourly Free Status Report

on:
  push:
    branches: [main]
    paths: ['.github/workflows/wic-hourly-free-status.yml']
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: wic-hourly-free-status-report
  cancel-in-progress: true

jobs:
  hourly-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Build hourly status snapshot from existing evidence
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('feedback_pipeline')
          evidence_dir = root / 'evidence'
          out_dir = Path('observer') / 'runtime'
          out_dir.mkdir(parents=True, exist_ok=True)

          def read_json(path):
              try:
                  return json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  return None

          production = read_json(evidence_dir / 'tool044_production_loop.json') or {}
          queue = read_json(root / 'tool044_atomic_demand_queue.json') or {}
          demands = queue.get('demands', [])
          counts = {}
          for d in demands:
              s = str(d.get('status', 'UNKNOWN'))
              counts[s] = counts.get(s, 0) + 1

          gate_path = Path('CONTROL_TOWER/ledger/evidence/WIC_COMMON_EXECUTION_BOUNDARY_CHECKPOINT_20261019.json')
          gate = read_json(gate_path) or {}
          latest_checkpoint = str(gate_path) if gate_path.is_file() else None
          latest_evidence = latest_checkpoint

          report = {
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
              'source': 'FREE_GITHUB_ACTIONS_NO_CHATGPT_CODEX_WORK_SCHEDULE',
              'production_loop_status': 'START_BLOCKED' if gate.get('start_blocked', True) else (production.get('results', [{}])[-1].get('status') if production.get('results') else production.get('status')),
              'historical_production_status': production.get('results', [{}])[-1].get('status') if production.get('results') else production.get('status'),
              'start_blocked': gate.get('start_blocked', True),
              'overall_control': gate.get('overall_control', 'NOT_VERIFIED'),
              'latest_gate_commit': (gate.get('latest_mutating_boundary_delta') or {}).get('commit'),
              'latest_gate_test_run': (gate.get('latest_mutating_boundary_delta') or {}).get('focused_run_id'),
              'unverified_control_boundaries': gate.get('remaining_unverified_controllable', []),
              'tool042_customer_output': (gate.get('tool042_actual_customer_validation') or {}).get('status', 'NOT_VERIFIED'),
              'observer_live_deployment': (gate.get('observer_surface') or {}).get('actual_live_deployment', 'NOT_VERIFIED'),
              'production_run_id': production.get('run_id'),
              'queue_status_counts': counts,
              'latest_evidence': latest_evidence,
              'latest_checkpoint': latest_checkpoint,
              'automatic_next_task_claim': production.get('automatic_next_task_claim'),
              'user_manual_relay_required': production.get('user_manual_relay_required'),
          }
          (out_dir / 'hourly-status.json').write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          with (out_dir / 'hourly-status-history.jsonl').open('a', encoding='utf-8') as f:
              f.write(json.dumps(report, ensure_ascii=False, separators=(',', ':')) + '\n')
          print(json.dumps(report, ensure_ascii=False))
          PY
      - name: Persist hourly status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add observer/runtime/hourly-status.json observer/runtime/hourly-status-history.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'observer: record hourly free runtime status'
          git pull --rebase origin main
          git push origin HEAD:main
