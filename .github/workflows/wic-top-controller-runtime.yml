name: WIC Top Controller Independent Runtime

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: wic-top-controller-runtime
  cancel-in-progress: false

jobs:
  controller-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Provide existing reconciler repository path
        run: ln -s . _wic_speed_runner_audit
      - name: Run existing controller through independent adapter
        run: python CONTROL_TOWER/controller/github_runtime_cycle.py
      - name: Validate durable result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('CONTROL_TOWER/ledger/evidence/WIC_TOP_CONTROLLER_INDEPENDENT_RUNTIME.json')
          e=json.loads(p.read_text(encoding='utf-8'))
          required=('process_started','dynamic_requirement_router','contract_state_readback_pass','queue_persisted','state_persisted')
          assert all(e[k] for k in required), e
          assert e['queue_auto_continuation'] or e['queue_drained'], e
          print('PASS', e['run_id'], e['remaining_queue_count'])
          PY
      - name: Persist queue state and evidence
        run: |
          git config user.name "wic-controller-bot"
          git config user.email "actions@users.noreply.github.com"
          git add CONTROL_TOWER/controller/runtime CONTROL_TOWER/ledger/evidence/WIC_TOP_CONTROLLER_INDEPENDENT_RUNTIME.json CONTROL_TOWER/tool034_state.json public/wic_observer_state.json
          git diff --cached --quiet && exit 0
          git commit -m "Persist WIC controller runtime cycle $GITHUB_RUN_ID"
          git pull --rebase origin main
          git push origin HEAD:main
