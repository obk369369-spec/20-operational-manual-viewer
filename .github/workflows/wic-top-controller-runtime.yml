name: WIC Top Controller Independent Runtime

on:
  push:
    paths:
      - '.github/workflows/wic-top-controller-runtime.yml'
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: wic-top-controller-runtime
  cancel-in-progress: false

jobs:
  controller-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce central admission and user stop for controller-cycle
        env:
          WIC_USER_STOP: ${{ vars.WIC_USER_STOP }}
          WIC_RULE_ADMISSION_JSON: ${{ vars.WIC_RULE_ADMISSION_JSON }}
        run: python CONTROL_TOWER/controller/pre_work_admission.py --require-admission --work-id 'workflow:wic-top-controller-runtime:controller-cycle' --task-id CENTRAL
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Provide existing reconciler repository path
        run: ln -s . _wic_speed_runner_audit
      - name: Run existing controller through independent adapter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIC_HANDOFF_INPUT_JSON: >-
            {"trace_id":"REMOTE-${{ github.run_id }}","root_id":"CENTRAL_AUTONOMY_REPEAT_ASSURANCE","input":"사용자 입력 1회","expected_output":"central execution evidence","scope":"COMMON_PLATFORM","checkpoint":"REMOTE-${{ github.run_id }}"}
        run: python CONTROL_TOWER/controller/github_runtime_cycle.py
      - name: Validate durable result
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('CONTROL_TOWER/ledger/evidence/WIC_TOP_CONTROLLER_INDEPENDENT_RUNTIME.json')
          e=json.loads(p.read_text(encoding='utf-8'))
          required=('process_started','dynamic_requirement_router','contract_state_readback_pass','queue_persisted','state_persisted')
          assert all(e[k] for k in required), e
          assert e['work_start_token']['work_id']=='WIC-RUNTIME-CYCLE', e
          assert e['work_start_token']['git_sha']==os.environ['GITHUB_SHA'], e
          assert e['work_start_token']['scope_verified'] is True, e
          assert e['queue_auto_continuation'] or e['queue_drained'], e
          assert e['repeat_block_enforcement'] is True, e
          assert e['no_progress_gate'] is True, e
          assert e['credit_waste_gate'] is True, e
          assert e['handoff']['status']=='ACCEPTED', e
          assert e['handoff']['user_manual_repetition']==0, e
          print('PASS', e['run_id'], e['remaining_queue_count'])
          PY
      - name: Persist queue state and evidence
        run: |
          git config user.name "wic-controller-bot"
          git config user.email "actions@users.noreply.github.com"
          git add CONTROL_TOWER/controller/runtime CONTROL_TOWER/ledger/evidence/WIC_TOP_CONTROLLER_INDEPENDENT_RUNTIME.json CONTROL_TOWER/ledger/evidence/WIC_INTERNAL_COMMON_GOVERNANCE_CLOSURE_20261013.json CONTROL_TOWER/tool034_state.json public/wic_observer_state.json feedback_pipeline/unified_open_ledger.json
          git diff --cached --quiet && exit 0
          git commit -m "Persist WIC controller runtime cycle $GITHUB_RUN_ID"
          git pull --rebase origin main
          git push origin HEAD:main
