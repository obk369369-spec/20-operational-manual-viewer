name: WIC feedback event apply

on:
  push:
    paths:
      - 'feedback_pipeline/pending_event.json'

permissions:
  contents: write

concurrency:
  group: wic-feedback-event-main
  cancel-in-progress: false

jobs:
  apply-feedback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run one CENTRAL_MASTER_DESTRUCTIVE_UPDATE fixture
        run: python feedback_pipeline/canonical_writer.py

      - name: PRECHECK_USER_DIRECTIVE before material mutation
        run: |
          python - <<'PY'
          import json
          import subprocess
          from dataclasses import asdict
          from datetime import datetime, timezone
          from pathlib import Path
          import sys

          sys.path.insert(0, 'feedback_pipeline')
          from unauthorized_structure_guard import ChangeProposal, build_observer_report, evaluate

          event_path = Path('feedback_pipeline/pending_event.json')
          event = json.loads(event_path.read_text(encoding='utf-8'))
          proposal = ChangeProposal(
              action=str(event.get('mutation_action', '')).strip(),
              target='WIC_GLOBAL_OPERATING_RULES.md',
              directive_text=str(event.get('directive_text', event.get('text', ''))).strip(),
              directive_source_ref=str(event.get('directive_source_ref', event.get('source_ref', ''))).strip(),
          )
          decision = evaluate(proposal)
          evidence = {
              'schema_version': 2,
              'stage': 'PRECHECK_USER_DIRECTIVE',
              'decision': asdict(decision),
              'blocked_before_mutation': decision.decision != 'ALLOW',
          }
          if decision.decision == 'DENY_HOLD':
              evidence['observer_report'] = build_observer_report(decision)
          out = Path('feedback_pipeline/preflight_evidence.json')
          out.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          read_back = json.loads(out.read_text(encoding='utf-8'))
          assert read_back['stage'] == 'PRECHECK_USER_DIRECTIVE'
          assert read_back['decision']['decision'] == decision.decision

          if decision.decision != 'ALLOW':
              report = evidence['observer_report']
              observer_path = Path('WIC_OBSERVER_STATUS.md')
              observer_text = observer_path.read_text(encoding='utf-8')
              start = '<!-- WIC_DENY_OBSERVER_AUTO_START -->'
              end = '<!-- WIC_DENY_OBSERVER_AUTO_END -->'
              generated = datetime.now(timezone.utc).isoformat()
              auto_block = (
                  f"{start}\n"
                  "## 최근 DENY 자동 관찰자 보고\n"
                  f"- generated_at_utc: `{generated}`\n"
                  f"- decision: `{decision.decision}`\n"
                  f"- action: `{decision.action}`\n"
                  f"- target: `{decision.target}`\n"
                  f"- reason: `{decision.reason}`\n"
                  f"- error_class: `{'STRUCTURAL_ERROR_UNAUTHORIZED' if report.get('structural_error_unauthorized') else ''}`\n"
                  f"- blocked_before_mutation: `{str(bool(report.get('blocked_before_mutation', True))).lower()}`\n"
                  f"- directive_source_ref: `{decision.directive_source_ref}`\n"
                  f"{end}"
              )
              if start in observer_text and end in observer_text:
                  before = observer_text.split(start, 1)[0].rstrip()
                  after = observer_text.split(end, 1)[1].lstrip('\n')
                  observer_text = before + '\n\n' + auto_block + ('\n\n' + after if after else '\n')
              else:
                  observer_text = observer_text.rstrip() + '\n\n' + auto_block + '\n'
              observer_path.write_text(observer_text, encoding='utf-8')

              subprocess.run(['git', 'config', 'user.name', 'wic-integration-bot'], check=True)
              subprocess.run(['git', 'config', 'user.email', 'wic-integration-bot@users.noreply.github.com'], check=True)
              subprocess.run(['git', 'add', 'WIC_OBSERVER_STATUS.md', 'feedback_pipeline/preflight_evidence.json'], check=True)
              subprocess.run(['git', 'commit', '-m', 'wic: persist denied preflight observer evidence [skip ci]'], check=True)
              subprocess.run(['git', 'push'], check=True)
              subprocess.run(['git', 'fetch', 'origin', 'main'], check=True)
              remote_observer = subprocess.run(
                  ['git', 'show', 'origin/main:WIC_OBSERVER_STATUS.md'],
                  check=True, capture_output=True, text=True
              ).stdout
              remote_evidence = subprocess.run(
                  ['git', 'show', 'origin/main:feedback_pipeline/preflight_evidence.json'],
                  check=True, capture_output=True, text=True
              ).stdout
              assert start in remote_observer and decision.action in remote_observer
              remote_evidence_json = json.loads(remote_evidence)
              assert remote_evidence_json['decision']['decision'] == 'DENY_HOLD'
              assert remote_evidence_json['blocked_before_mutation'] is True
              print(json.dumps(evidence, ensure_ascii=False))
              raise SystemExit('DENY_HOLD: evidence persisted to observer before APPLY')
          print('PASS: PRECHECK_USER_DIRECTIVE allowed exact approved user directive before APPLY')
          PY

      - name: Apply pending real feedback event
        run: python feedback_pipeline/apply_feedback_event.py | tee /tmp/wic-event-result.json

      - name: Keep CENTRAL fallback active for every target
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('feedback_pipeline/state.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('feedback_pipeline/target_apply_manifest.json').read_text(encoding='utf-8'))
          fid = manifest['feedback_id']
          cp = state['integration_core']['feedback_checkpoints'][fid]
          assert cp['status'] == 'PASS_CENTRAL_FALLBACK'
          assert cp['last_stage'] == 'RESTART_OR_HOLD'
          assert state['integration_core']['structure_pass'] is True
          assert manifest['central_fallback']['status'] == 'ACTIVE'
          assert all(x.get('status') == 'CENTRAL_FALLBACK_ACTIVE' for x in manifest.get('targets', {}).values())
          print('PASS: CENTRAL fallback keeps all chats/tools operational before any target-repository work')
          PY

      - name: Best-effort target repository reuse or auto-create
        env:
          GH_TOKEN: ${{ secrets.WIC_REPO_CREATE_TOKEN }}
          OWNER: obk369369-spec
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          manifest_path = Path('feedback_pipeline/target_apply_manifest.json')
          registry_path = Path('feedback_pipeline/target_adapter_registry.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          registry = json.loads(registry_path.read_text(encoding='utf-8'))
          repo_targets = registry.get('repository_targets', {})
          lane_targets = registry.get('lane_targets', {})
          token = os.environ.get('GH_TOKEN', '').strip()
          owner = os.environ.get('OWNER', '').strip()
          create_results = {}

          def repo_name_for(target: str) -> str:
              safe = ''.join(c.lower() if c.isalnum() else '-' for c in target).strip('-')
              return f'wic-{safe}' if safe else 'wic-unregistered-target'

          for target in manifest.get('targets', {}):
              if target in lane_targets and lane_targets[target].get('repository_required') is False:
                  create_results[target] = {
                      'status': 'CENTRAL_LANE_REUSE',
                      'repository': None,
                      'reason': 'registered central lane does not require a separate repository'
                  }
                  continue

              registered = repo_targets.get(target, {})
              full = str(registered.get('repository', '')).strip()
              if full:
                  repo = full.split('/', 1)[1] if '/' in full else full
              else:
                  repo = repo_name_for(target)
                  full = f'{owner}/{repo}'

              # Repository discovery uses the built-in GITHUB_TOKEN when possible.
              # Creation itself uses WIC_REPO_CREATE_TOKEN only; never invent success.
              check_env = dict(os.environ)
              if not check_env.get('GH_TOKEN'):
                  check_env['GH_TOKEN'] = check_env.get('GITHUB_TOKEN', '')
              exists = subprocess.run(
                  ['gh', 'api', f'repos/{full}'],
                  env=check_env,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              ).returncode == 0
              if exists:
                  create_results[target] = {'status': 'REUSE_EXISTING_REPOSITORY', 'repository': full}
                  continue

              if registered:
                  create_results[target] = {
                      'status': 'REPOSITORY_ACCESS_HOLD',
                      'repository': full,
                      'reason': 'registered repository was not reachable; CENTRAL_FALLBACK remains ACTIVE'
                  }
                  continue

              if not token:
                  create_results[target] = {
                      'status': 'REPOSITORY_CREATE_HOLD',
                      'repository': full,
                      'reason': 'WIC_REPO_CREATE_TOKEN unavailable; CENTRAL_FALLBACK remains ACTIVE'
                  }
                  continue

              r = subprocess.run([
                  'gh','api','user/repos','-X','POST',
                  '-f',f'name={repo}',
                  '-F','private=true',
                  '-f','description=WIC auto-created target repository'
              ], capture_output=True, text=True)
              if r.returncode == 0:
                  create_results[target] = {'status': 'REPOSITORY_CREATED', 'repository': full}
              else:
                  create_results[target] = {
                      'status': 'REPOSITORY_CREATE_HOLD',
                      'repository': full,
                      'reason': (r.stderr or r.stdout or 'repository create failed').strip()[:500],
                  }

          manifest['repository_resolution'] = create_results
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(create_results, ensure_ascii=False))
          PY

      - name: Verify generated canonical section and checkpoint
        run: |
          test -f feedback_pipeline/target_apply_manifest.json
          test -d feedback_pipeline/evidence
          grep -q 'WIC_CANONICAL_FEEDBACK_START' WIC_GLOBAL_OPERATING_RULES.md
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('feedback_pipeline/state.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('feedback_pipeline/target_apply_manifest.json').read_text(encoding='utf-8'))
          fid = manifest['feedback_id']
          evidence = json.loads(Path(f'feedback_pipeline/evidence/{fid}.json').read_text(encoding='utf-8'))
          preservation = evidence['central_master_destructive_update_gate']
          assert preservation['verified'] is True
          assert preservation['lost_record_ids'] == []
          assert preservation['unintentionally_changed_record_ids'] == []
          cp = state['integration_core']['feedback_checkpoints'][fid]
          assert cp['last_stage'] == 'RESTART_OR_HOLD'
          assert cp['status'] == 'PASS_CENTRAL_FALLBACK'
          assert state['integration_core']['structure_pass'] is True
          assert manifest['central_fallback']['status'] == 'ACTIVE'
          print('PASS: canonical write/read-back complete and fallback is immediately usable')
          PY

      - name: Commit canonical mutation and evidence
        run: |
          git config user.name 'wic-integration-bot'
          git config user.email 'wic-integration-bot@users.noreply.github.com'
          git add WIC_GLOBAL_OPERATING_RULES.md feedback_pipeline/state.json feedback_pipeline/target_apply_manifest.json feedback_pipeline/evidence feedback_pipeline/preflight_evidence.json
          if git diff --cached --quiet; then
            echo 'No canonical changes to commit.'
          else
            git commit -m 'wic: apply pending feedback event [skip ci]'
            if ! git push; then
              git pull --rebase origin "${GITHUB_REF_NAME}"
              git push
            fi
          fi

      - name: Verify remote read-back and Commit SHA
        id: remote_readback
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse "origin/${GITHUB_REF_NAME}")"
          test "$local_sha" = "$remote_sha"
          git show "origin/${GITHUB_REF_NAME}:WIC_GLOBAL_OPERATING_RULES.md" >/tmp/remote_master.txt
          git show "origin/${GITHUB_REF_NAME}:feedback_pipeline/target_apply_manifest.json" >/tmp/remote_manifest.json
          grep -q 'WIC_CANONICAL_FEEDBACK_START' /tmp/remote_master.txt
          python - <<'PY'
          import json
          m=json.load(open('/tmp/remote_manifest.json',encoding='utf-8'))
          assert m['central_fallback']['status']=='ACTIVE'
          print('PASS: remote read-back matches and CENTRAL fallback is persisted')
          PY
          echo "commit_sha=$remote_sha" >> "$GITHUB_OUTPUT"

      - name: Generate observer chat report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('feedback_pipeline/target_apply_manifest.json').read_text(encoding='utf-8'))
          r=m.get('repository_resolution',{})
          holds=[v for v in r.values() if v.get('status') in {'REPOSITORY_CREATE_HOLD','REPOSITORY_ACCESS_HOLD'}]
          if holds:
              print(f"중앙마스터 반영 완료 / 중앙 fallback ACTIVE / 저장소 보강 HOLD {len(holds)}건 / 현재 업무 계속 가능")
          else:
              print(f"중앙마스터 반영 완료 / 대상 저장소 처리 {len(r)}건 / 중앙 fallback ACTIVE / 실패 0건")
          PY
