name: WIC feedback event apply

on:
  push:
    paths:
      - 'feedback_pipeline/pending_event.json'

permissions:
  contents: write

concurrency:
  group: wic-feedback-event-main
  cancel-in-progress: false

jobs:
  apply-feedback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run existing ingest fixtures
        run: python feedback_pipeline/cross_chat_feedback_ingest.py

      - name: Run existing canonical writer fixtures
        run: python feedback_pipeline/canonical_writer.py

      - name: PRECHECK_USER_DIRECTIVE before material mutation
        run: |
          python - <<'PY'
          import json
          import subprocess
          from dataclasses import asdict
          from datetime import datetime, timezone
          from pathlib import Path
          import sys

          sys.path.insert(0, 'feedback_pipeline')
          from unauthorized_structure_guard import ChangeProposal, build_observer_report, evaluate

          event_path = Path('feedback_pipeline/pending_event.json')
          event = json.loads(event_path.read_text(encoding='utf-8'))
          proposal = ChangeProposal(
              action=str(event.get('mutation_action', '')).strip(),
              target='WIC_GLOBAL_OPERATING_RULES.md',
              directive_text=str(event.get('directive_text', event.get('text', ''))).strip(),
              directive_source_ref=str(event.get('directive_source_ref', event.get('source_ref', ''))).strip(),
          )
          decision = evaluate(proposal)
          evidence = {
              'schema_version': 2,
              'stage': 'PRECHECK_USER_DIRECTIVE',
              'decision': asdict(decision),
              'blocked_before_mutation': decision.decision != 'ALLOW',
          }
          if decision.decision == 'DENY_HOLD':
              evidence['observer_report'] = build_observer_report(decision)
          out = Path('feedback_pipeline/preflight_evidence.json')
          out.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          read_back = json.loads(out.read_text(encoding='utf-8'))
          assert read_back['stage'] == 'PRECHECK_USER_DIRECTIVE'
          assert read_back['decision']['decision'] == decision.decision

          if decision.decision != 'ALLOW':
              report = evidence['observer_report']
              observer_path = Path('WIC_OBSERVER_STATUS.md')
              observer_text = observer_path.read_text(encoding='utf-8')
              start = '<!-- WIC_DENY_OBSERVER_AUTO_START -->'
              end = '<!-- WIC_DENY_OBSERVER_AUTO_END -->'
              generated = datetime.now(timezone.utc).isoformat()
              auto_block = (
                  f"{start}\n"
                  "## 최근 DENY 자동 관찰자 보고\n"
                  f"- generated_at_utc: `{generated}`\n"
                  f"- decision: `{decision.decision}`\n"
                  f"- action: `{decision.action}`\n"
                  f"- target: `{decision.target}`\n"
                  f"- reason: `{decision.reason}`\n"
                  f"- error_class: `{'STRUCTURAL_ERROR_UNAUTHORIZED' if report.get('structural_error_unauthorized') else ''}`\n"
                  f"- blocked_before_mutation: `{str(bool(report.get('blocked_before_mutation', True))).lower()}`\n"
                  f"- directive_source_ref: `{decision.directive_source_ref}`\n"
                  f"{end}"
              )
              if start in observer_text and end in observer_text:
                  before = observer_text.split(start, 1)[0].rstrip()
                  after = observer_text.split(end, 1)[1].lstrip('\n')
                  observer_text = before + '\n\n' + auto_block + ('\n\n' + after if after else '\n')
              else:
                  observer_text = observer_text.rstrip() + '\n\n' + auto_block + '\n'
              observer_path.write_text(observer_text, encoding='utf-8')

              # Persist DENY evidence before the workflow stops. This is the observer path,
              # not a new structure: overwrite the existing observer status and evidence file.
              subprocess.run(['git', 'config', 'user.name', 'wic-integration-bot'], check=True)
              subprocess.run(['git', 'config', 'user.email', 'wic-integration-bot@users.noreply.github.com'], check=True)
              subprocess.run(['git', 'add', 'WIC_OBSERVER_STATUS.md', 'feedback_pipeline/preflight_evidence.json'], check=True)
              subprocess.run(['git', 'commit', '-m', 'wic: persist denied preflight observer evidence [skip ci]'], check=True)
              subprocess.run(['git', 'push'], check=True)
              subprocess.run(['git', 'fetch', 'origin', 'main'], check=True)
              remote_observer = subprocess.run(
                  ['git', 'show', 'origin/main:WIC_OBSERVER_STATUS.md'],
                  check=True, capture_output=True, text=True
              ).stdout
              remote_evidence = subprocess.run(
                  ['git', 'show', 'origin/main:feedback_pipeline/preflight_evidence.json'],
                  check=True, capture_output=True, text=True
              ).stdout
              assert start in remote_observer and decision.action in remote_observer
              remote_evidence_json = json.loads(remote_evidence)
              assert remote_evidence_json['decision']['decision'] == 'DENY_HOLD'
              assert remote_evidence_json['blocked_before_mutation'] is True
              print(json.dumps(evidence, ensure_ascii=False))
              raise SystemExit('DENY_HOLD: evidence persisted to observer before APPLY')
          print('PASS: PRECHECK_USER_DIRECTIVE allowed exact approved user directive before APPLY')
          PY

      - name: Apply pending real feedback event
        run: python feedback_pipeline/apply_feedback_event.py | tee /tmp/wic-event-result.json

      - name: Finalize verified same-repository lane targets when possible
        run: |
          python - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('feedback_pipeline')
          state_path = root / 'state.json'
          manifest_path = root / 'target_apply_manifest.json'
          adapters_path = root / 'target_adapter_registry.json'
          evidence_dir = root / 'evidence'

          state = json.loads(state_path.read_text(encoding='utf-8'))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          adapters = json.loads(adapters_path.read_text(encoding='utf-8'))
          fid = manifest['feedback_id']
          rev = manifest['canonical_revision']
          targets = manifest.get('targets', {})
          lane_targets = adapters.get('lane_targets', {})

          # Cross-repository or unknown targets remain HOLD; never fake target PASS.
          unsupported = [t for t in targets if t not in lane_targets]
          if unsupported:
              print('HOLD: target apply requires non-central adapter:', ','.join(unsupported))
              raise SystemExit(0)

          records = []
          for target, target_item in targets.items():
              adapter = lane_targets[target]
              if adapter.get('mode') != 'CENTRAL_LANE_ACK' or adapter.get('repository_required') is not False:
                  print('HOLD: lane adapter is not verified same-repository ACK:', target)
                  raise SystemExit(0)
              payload = {
                  'target': target,
                  'feedback_id': fid,
                  'canonical_revision': rev,
                  'decision': target_item.get('decision'),
                  'apply_mode': adapter.get('mode'),
                  'evidence_contract': adapter.get('evidence'),
                  'status': 'APPLIED_READBACK_TEST_PASS_INTERNAL_GITHUB'
              }
              raw = json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
              payload['ack_sha256'] = hashlib.sha256(raw).hexdigest()
              records.append(payload)

          cp = state['integration_core']['feedback_checkpoints'][fid]
          cp.pop('blocker', None)
          cp['last_stage'] = 'RESTART_OR_HOLD'
          cp['status'] = 'PASS_INTERNAL_GITHUB_E2E'
          cache = state['integration_core'].setdefault('target_revision_cache', {})
          for record in records:
              cache[record['target']] = {
                  'canonical_revision': rev,
                  'status': record['status'],
                  'evidence_contract': record['evidence_contract'],
                  'ack_sha256': record['ack_sha256'],
                  'external_independent_verification': False
              }
          state['integration_core']['structure_pass'] = True
          state['integration_core']['structure_pass_reason'] = 'Actual feedback completed canonical write/read-back plus verified central-lane target apply/read-back/test in one GitHub workflow.'
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')

          evidence = {
              'schema_version': 1,
              'generated_at_utc': datetime.now(timezone.utc).isoformat(),
              'feedback_id': fid,
              'canonical_revision': rev,
              'records': records,
              'result': 'PASS_INTERNAL_GITHUB_E2E',
              'external_independent_verification': False
          }
          evidence_path = evidence_dir / f'{fid}_target_apply.json'
          evidence_path.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Immediate target-state/evidence read-back.
          state_rb = json.loads(state_path.read_text(encoding='utf-8'))
          evidence_rb = json.loads(evidence_path.read_text(encoding='utf-8'))
          assert state_rb['integration_core']['feedback_checkpoints'][fid]['status'] == 'PASS_INTERNAL_GITHUB_E2E'
          assert state_rb['integration_core']['feedback_checkpoints'][fid]['last_stage'] == 'RESTART_OR_HOLD'
          assert evidence_rb['result'] == 'PASS_INTERNAL_GITHUB_E2E'
          assert {x['target'] for x in evidence_rb['records']} == set(targets)
          print('PASS: verified central-lane target apply/read-back/test finalized for actual feedback event')
          PY

      - name: Verify generated canonical section and checkpoint
        run: |
          test -f feedback_pipeline/target_apply_manifest.json
          test -d feedback_pipeline/evidence
          grep -q 'WIC_CANONICAL_FEEDBACK_START' WIC_GLOBAL_OPERATING_RULES.md
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('feedback_pipeline/state.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('feedback_pipeline/target_apply_manifest.json').read_text(encoding='utf-8'))
          adapters = json.loads(Path('feedback_pipeline/target_adapter_registry.json').read_text(encoding='utf-8'))
          fid = manifest['feedback_id']
          cp = state['integration_core']['feedback_checkpoints'][fid]
          targets = set(manifest.get('targets', {}))
          same_repo_lanes = targets <= set(adapters.get('lane_targets', {}))
          if same_repo_lanes:
              assert cp['last_stage'] == 'RESTART_OR_HOLD'
              assert cp['status'] == 'PASS_INTERNAL_GITHUB_E2E'
              assert state['integration_core']['structure_pass'] is True
              print('PASS: actual feedback canonical + same-repository target apply/read-back/test complete')
          else:
              assert cp['last_stage'] == 'TARGET_REVISION_READ_APPLY'
              assert cp['status'] == 'HOLD'
              assert state['integration_core']['structure_pass'] is False
              print('HOLD: canonical write/read-back complete; external target apply remains required')
          PY

      - name: Commit canonical mutation and evidence
        run: |
          git config user.name 'wic-integration-bot'
          git config user.email 'wic-integration-bot@users.noreply.github.com'
          git add WIC_GLOBAL_OPERATING_RULES.md feedback_pipeline/state.json feedback_pipeline/target_apply_manifest.json feedback_pipeline/evidence feedback_pipeline/preflight_evidence.json
          if git diff --cached --quiet; then
            echo 'No canonical changes to commit.'
          else
            git commit -m 'wic: apply pending feedback event [skip ci]'
            git push
          fi
