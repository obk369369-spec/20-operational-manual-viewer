name: WIC Render ENV2 authenticated round trip

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-env2-roundtrip.yml'
  schedule:
    - cron: '27 * * * *'
  workflow_dispatch:

concurrency:
  group: wic-render-env2-authenticated-roundtrip
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  issue-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Persist issued identity before external execution
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, uuid
          from datetime import datetime, timezone
          from pathlib import Path
          run_id = os.environ['RUN_ID']
          issued = {
              'schema_version': 1,
              'status': 'ISSUED',
              'issued_at_utc': datetime.now(timezone.utc).isoformat(),
              'source_id': 'WIC-CANONICAL-MAIN',
              'intake_id': f'TOOL044-{run_id}',
              'tool_id': 'TOOL016',
              'job_id': f'render-env2-gh-{run_id}',
              'execution_id': 'render-exec-' + uuid.uuid4().hex[:12],
              'result_id': 'render-result-' + uuid.uuid4().hex[:12],
              'ack_id': 'render-ack-' + uuid.uuid4().hex[:12],
          }
          path = Path('feedback_pipeline/evidence') / f"{issued['job_id']}_render_env2_issued.json"
          path.write_text(json.dumps(issued, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
              for key in ('source_id','intake_id','tool_id','job_id','execution_id','result_id','ack_id'):
                  out.write(f"WIC_{key.upper()}={issued[key]}\n")
          PY
          git config user.name 'wic-integration-bot'
          git config user.email 'wic-integration-bot@users.noreply.github.com'
          git add feedback_pipeline/evidence
          git commit -m 'wic: issue correlated Render factory job'
          git push

      - name: Issue one correlated job and require Render ACK
        env:
          GH_CALLBACK_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          payload = {
              'identity': {
                  'source_id': os.environ['WIC_SOURCE_ID'],
                  'intake_id': os.environ['WIC_INTAKE_ID'],
                  'tool_id': os.environ['WIC_TOOL_ID'],
                  'job_id': os.environ['WIC_JOB_ID'],
                  'execution_id': os.environ['WIC_EXECUTION_ID'],
                  'result_id': os.environ['WIC_RESULT_ID'],
                  'ack_id': os.environ['WIC_ACK_ID'],
              },
              'callback': {
                  'url': 'https://api.github.com/repos/obk369369-spec/20-operational-manual-viewer/dispatches',
                  'token': os.environ['GH_CALLBACK_TOKEN'],
              },
          }
          req = urllib.request.Request(
              'https://two0-operational-manual-viewer.onrender.com/execute',
              data=json.dumps(payload).encode(),
              headers={'Content-Type': 'application/json', 'User-Agent': 'WIC-TOOL016'},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=60) as response:
              result = json.loads(response.read().decode())
          if result.get('status') != 'PASS':
              raise SystemExit(f"Render job failed: {result}")
          job = result['job']
          if job['job_id'] != os.environ['WIC_JOB_ID'] or job['tool016_return']['status'] != 'PASS':
              raise SystemExit('Render identity/return ACK mismatch')
          print(json.dumps({
              'JOB_ID': job['job_id'],
              'EXECUTION_ID': job['execution_id'],
              'RESULT_ID': job['result_id'],
              'ACK_ID': job['ack_id'],
              'RESULT_RETURN': job['tool016_return']['status'],
              'ACK_RETURN': job['tool016_ack'],
          }))
          PY
