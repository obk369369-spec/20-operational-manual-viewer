name: TOOL044 Registered Target Deploy Validation
# trigger: registered-target-adapter-e2e-20260925

on:
  push:
    paths:
      - 'feedback_pipeline/tool044_safe_integration.py'
      - '.github/workflows/tool044-registered-target-deploy-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Enforce central admission and user stop for validate
        env:
          WIC_USER_STOP: ${{ vars.WIC_USER_STOP }}
          WIC_RULE_ADMISSION_JSON: ${{ vars.WIC_RULE_ADMISSION_JSON }}
        run: python CONTROL_TOWER/controller/pre_work_admission.py --require-admission --work-id 'workflow:tool044-registered-target-deploy-validation:validate' --task-id TOOL044
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate registered-target deployment and rollback
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from feedback_pipeline.tool044_safe_integration import registered_target_self_test
          from feedback_pipeline.tool044_composition import classify_publisher_identity
          result=registered_target_self_test()
          if result["status"]!="PASS":
              raise SystemExit(json.dumps(result))
          official=['kiro.re.kr']
          resellers=['marketresearch.com','researchandmarkets.com']
          cases={
            'actual_official': classify_publisher_identity('https://www.kiro.re.kr/enjoy/report.asp?bidx=5537',official,resellers),
            'reseller_market_research': classify_publisher_identity('https://www.marketresearch.com/report/example',official,resellers),
            'reseller_research_and_markets': classify_publisher_identity('https://www.researchandmarkets.com/reports/example',official,resellers),
            'lookalike': classify_publisher_identity('https://kiro.re.kr.evil.example/report',official,resellers),
            'malformed': classify_publisher_identity('not a url',official,resellers),
          }
          assert cases['actual_official']['status']=='VERIFIED_OFFICIAL_DOMAIN'
          assert cases['actual_official']['provenance']=='OFFICIAL_ALLOWLIST'
          assert cases['reseller_market_research']['status']=='REJECT_RESELLER'
          assert cases['reseller_research_and_markets']['status']=='REJECT_RESELLER'
          assert cases['lookalike']['status']=='HOLD_UNVERIFIED_PUBLISHER'
          assert cases['malformed']['status']=='HOLD_INVALID_URL'
          result['publisher_identity_validation']={
            'status':'PASS','actual_input':'KIRO bidx=5537 official report detail URL',
            'expected_actual':'MATCH','positive':'PASS','negative':'PASS',
            'failure_injection':'PASS','regression':'PASS','cases':cases,
          }
          out=Path("feedback_pipeline/evidence/tool044_registered_target_adapter.json")
          out.write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result))
          PY
      - name: Verify independent closure before validation PASS promotion
        env:
          WIC_CLOSURE_RECEIPTS_JSON: ${{ vars.WIC_CLOSURE_RECEIPTS_JSON }}
        run: python CONTROL_TOWER/controller/pre_work_admission.py --require-completion --work-id 'workflow:tool044-registered-target-deploy-validation:validate' --task-id TOOL044
      - name: Persist evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feedback_pipeline/evidence/tool044_registered_target_adapter.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'tool044: record registered target deploy adapter validation'
          git pull --rebase origin main
          git push origin HEAD:main
