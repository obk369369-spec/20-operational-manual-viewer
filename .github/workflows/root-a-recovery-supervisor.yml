name: ROOT A Recovery Supervisor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/root-a-recovery-supervisor.yml'
  schedule:
    - cron: '7 * * * *'
    - cron: '22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      force_recovery:
        description: 'Run one isolated recovery probe for failover validation'
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: root-a-recovery-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    if: ${{ vars.WIC_USER_STOP == '0' && vars.WIC_RULE_ADMISSION_JSON != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Enforce central admission and user stop for supervise
        env:
          WIC_USER_STOP: ${{ vars.WIC_USER_STOP }}
          WIC_RULE_ADMISSION_JSON: ${{ vars.WIC_RULE_ADMISSION_JSON }}
        run: python CONTROL_TOWER/controller/pre_work_admission.py --require-admission --work-id 'workflow:root-a-recovery-supervisor:supervise' --task-id CENTRAL
      - name: Inspect primary TOOL044 worker and recover if stalled
        id: recover
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_RECOVERY: ${{ inputs.force_recovery || false }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          workflow="tool044-cloud-worker.yml"
          now=$(date -u +%s)
          data=$(gh api "repos/$repo/actions/workflows/$workflow/runs?per_page=20")
          active=$(jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress")] | length' <<<"$data")
          last=$(jq -r '[.workflow_runs[] | select(.conclusion=="success")][0].updated_at // empty' <<<"$data")
          stale=1
          if [ -n "$last" ]; then
            last_epoch=$(date -u -d "$last" +%s)
            age=$((now-last_epoch))
            if [ "$age" -lt 1200 ]; then stale=0; fi
          fi
          if [ "$FORCE_RECOVERY" = "true" ]; then
            stale=1
            active=0
          fi
          echo "active=$active last_success=${last:-none} stale=$stale"
          if [ "$active" -eq 0 ] && [ "$stale" -eq 1 ]; then
            if ! python - <<'PY'
              import json
              import sys
              from pathlib import Path
              sys.path.insert(0, str(Path.cwd() / 'feedback_pipeline'))
              from work_execution_enforcer_legacy import preflight_attempt
              ledger = json.loads(Path('feedback_pipeline/unified_open_ledger.json').read_text(encoding='utf-8'))
              candidate = {'root_id': 'WIC16-CENTRAL-QUEUE-ISOLATION-20261022', 'operation_id': 'universal-external-binding-admission-20261023', 'cause_id': 'NO_CURRENT_WORK_OR_BUSINESS_EXECUTION_BINDING', 'method_id': 'EXACT_SCOPED_GATE_BEFORE_MUTATION', 'directive_ref': 'CURRENT_USER_DIRECTIVE_WIC16_NONPROD_EXTERNAL_TEST_20261023', 'action': 'RUN_SCOPED_ISOLATED_EXTERNAL_JOB_AND_RECOVERY', 'target_assets': ['.github/workflows/tool044-cloud-worker.yml', 'feedback_pipeline/unified_open_ledger.json']}
              result = preflight_attempt(candidate, ledger)
              print('PREFLIGHT_DECISION=' + result['decision'])
              sys.exit(0 if result['execution_allowed'] else 1)
              PY
            then
              echo "PREFLIGHT_BLOCKED_WORKER=1"
              echo "run_id=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            before=$(gh api "repos/$repo/actions/workflows/$workflow/runs?event=workflow_dispatch&per_page=1" --jq '.workflow_runs[0].id // 0')
            gh workflow run "$workflow" --repo "$repo" --ref main -f isolated_test=true
            run_id=""
            for _ in $(seq 1 12); do
              run_id=$(gh api "repos/$repo/actions/workflows/$workflow/runs?event=workflow_dispatch&per_page=10" --jq "[.workflow_runs[] | select(.id > $before)] | sort_by(.id) | last | .id // empty")
              [ -n "$run_id" ] && break
              sleep 5
            done
            test -n "$run_id"
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
            echo "RECOVERY_DISPATCHED=1"
          else
            echo "run_id=" >> "$GITHUB_OUTPUT"
            echo "RECOVERY_DISPATCHED=0"
          fi
      - name: Independent second-pass verification
        if: ${{ steps.recover.outputs.run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN_ID: ${{ steps.recover.outputs.run_id }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          gh run watch "$RECOVERY_RUN_ID" --repo "$repo" --exit-status
          conclusion=$(gh api "repos/$repo/actions/runs/$RECOVERY_RUN_ID" --jq '.conclusion')
          isolated=$(gh api "repos/$repo/actions/runs/$RECOVERY_RUN_ID/jobs" --jq '[.jobs[] | select(.name=="isolated-central-return")][0].conclusion')
          echo "recovery_run=$RECOVERY_RUN_ID conclusion=$conclusion isolated_central_return=$isolated"
          test "$conclusion" = success
          test "$isolated" = success
      - name: Supervisor report
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="$GITHUB_REPOSITORY"
          echo "ROOT_A_SUPERVISOR_UTC=$(date -u +%FT%TZ)"
          gh api "repos/$repo/actions/workflows/tool044-cloud-worker.yml/runs?per_page=5" --jq '.workflow_runs[] | [.id,.status,(.conclusion//"-"),.created_at] | @tsv' || true

      - name: Recover stale WIC top controller schedule
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          workflow="wic-top-controller-runtime.yml"
          now=$(date -u +%s)
          data=$(gh api "repos/$repo/actions/workflows/$workflow/runs?per_page=20")
          active=$(jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress")] | length' <<<"$data")
          last=$(jq -r '[.workflow_runs[] | select(.conclusion=="success")][0].updated_at // empty' <<<"$data")
          stale=1
          age_seconds=-1
          if [ -n "$last" ]; then
            last_epoch=$(date -u -d "$last" +%s)
            age_seconds=$((now-last_epoch))
            # Recover before the 2.5-hour continuity limit; scheduled triggers can be delayed.
            if [ "$age_seconds" -lt 5400 ]; then stale=0; fi
          fi
          echo "top_controller_active=$active last_success=${last:-none} age_seconds=$age_seconds stale=$stale"
          if [ "$active" -eq 0 ] && [ "$stale" -eq 1 ]; then
            if ! python - <<'PY'
              import json
              import sys
              from pathlib import Path
              sys.path.insert(0, str(Path.cwd() / 'feedback_pipeline'))
              from work_execution_enforcer_legacy import preflight_attempt
              ledger = json.loads(Path('feedback_pipeline/unified_open_ledger.json').read_text(encoding='utf-8'))
              candidate = {'root_id': 'WIC-TOP-CONTROLLER-INDEPENDENT-RUNTIME-20261005', 'operation_id': 'deploy-existing-controller-runtime', 'cause_id': 'TOP_CONTROLLER_SCHEDULE_STALE', 'method_id': 'EXISTING_GITHUB_ACTIONS_RECOVERY', 'directive_ref': 'USER_CURRENT_REMAINING_WORK_ONLY_20261005', 'action': 'DEPLOY_EXISTING_CONTROLLER_RUNTIME', 'target_assets': ['TOOL016', 'TOOL044', 'GITHUB_ACTIONS', 'WIC_TOP_CONTROLLER', 'CONTROLLER_RUNTIME_STATE']}
              result = preflight_attempt(candidate, ledger)
              print('PREFLIGHT_DECISION=' + result['decision'])
              sys.exit(0 if result['execution_allowed'] else 1)
              PY
            then
              echo "PREFLIGHT_BLOCKED_CONTROLLER=1"
              exit 0
            fi
            gh workflow run "$workflow" --repo "$repo" --ref main
            echo "TOP_CONTROLLER_RECOVERY_DISPATCHED=1"
          else
            echo "TOP_CONTROLLER_RECOVERY_DISPATCHED=0"
          fi

# recovery-generation: 2
