name: ROOT A Recovery Supervisor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/root-a-recovery-supervisor.yml'
  schedule:
    - cron: '7 * * * *'
    - cron: '22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      force_recovery:
        description: 'Run one isolated recovery probe for failover validation'
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: root-a-recovery-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect primary TOOL044 worker and recover if stalled
        id: recover
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_RECOVERY: ${{ inputs.force_recovery || false }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          workflow="tool044-cloud-worker.yml"
          now=$(date -u +%s)
          data=$(gh api "repos/$repo/actions/workflows/$workflow/runs?per_page=20")
          active=$(jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress")] | length' <<<"$data")
          last=$(jq -r '[.workflow_runs[] | select(.conclusion=="success")][0].updated_at // empty' <<<"$data")
          stale=1
          if [ -n "$last" ]; then
            last_epoch=$(date -u -d "$last" +%s)
            age=$((now-last_epoch))
            if [ "$age" -lt 1200 ]; then stale=0; fi
          fi
          if [ "$FORCE_RECOVERY" = "true" ]; then
            stale=1
            active=0
          fi
          echo "active=$active last_success=${last:-none} stale=$stale"
          if [ "$active" -eq 0 ] && [ "$stale" -eq 1 ]; then
            before=$(gh api "repos/$repo/actions/workflows/$workflow/runs?event=workflow_dispatch&per_page=1" --jq '.workflow_runs[0].id // 0')
            gh workflow run "$workflow" --repo "$repo" --ref main -f isolated_test=true
            run_id=""
            for _ in $(seq 1 12); do
              run_id=$(gh api "repos/$repo/actions/workflows/$workflow/runs?event=workflow_dispatch&per_page=10" --jq "[.workflow_runs[] | select(.id > $before)] | sort_by(.id) | last | .id // empty")
              [ -n "$run_id" ] && break
              sleep 5
            done
            test -n "$run_id"
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
            echo "RECOVERY_DISPATCHED=1"
          else
            echo "run_id=" >> "$GITHUB_OUTPUT"
            echo "RECOVERY_DISPATCHED=0"
          fi
      - name: Independent second-pass verification
        if: ${{ steps.recover.outputs.run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN_ID: ${{ steps.recover.outputs.run_id }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          gh run watch "$RECOVERY_RUN_ID" --repo "$repo" --exit-status
          conclusion=$(gh api "repos/$repo/actions/runs/$RECOVERY_RUN_ID" --jq '.conclusion')
          isolated=$(gh api "repos/$repo/actions/runs/$RECOVERY_RUN_ID/jobs" --jq '[.jobs[] | select(.name=="isolated-central-return")][0].conclusion')
          echo "recovery_run=$RECOVERY_RUN_ID conclusion=$conclusion isolated_central_return=$isolated"
          test "$conclusion" = success
          test "$isolated" = success
      - name: Supervisor report
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="$GITHUB_REPOSITORY"
          echo "ROOT_A_SUPERVISOR_UTC=$(date -u +%FT%TZ)"
          gh api "repos/$repo/actions/workflows/tool044-cloud-worker.yml/runs?per_page=5" --jq '.workflow_runs[] | [.id,.status,(.conclusion//"-"),.created_at] | @tsv' || true

# recovery-generation: 2
