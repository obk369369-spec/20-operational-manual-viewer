name: TOOL044 Canonical Instruction Intake

on:
  push:
    branches: [main]
    paths:
      - 'feedback_pipeline/tool044_instruction_intake.py'
      - 'feedback_pipeline/tool044_instruction_inbox.json'
      - 'feedback_pipeline/TOOL044_REQUEST_INBOX.json'
      - 'feedback_pipeline/tool044_function_state.json'
      - 'feedback_pipeline/tool044_request_router.py'
      - 'feedback_pipeline/tool016_visible_handoff.py'
      - 'feedback_pipeline/WIC_WORK_COMMON_EXECUTION_BLOCK.md'
      - '.github/workflows/tool044-canonical-instruction-intake.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: tool044-canonical-instruction-intake
  cancel-in-progress: false

jobs:
  intake-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: EXPECTED-ACTUAL duplicate merge supersede cross-tool PASS reuse tests
        run: |
          python feedback_pipeline/tool044_request_router.py --self-test
          python feedback_pipeline/tool044_instruction_intake.py --self-test
          python feedback_pipeline/tool044_work_parallel.py --self-test
      - name: Existing execution regression
        run: |
          python -m py_compile feedback_pipeline/tool044_multi_gate.py feedback_pipeline/tool044_instruction_intake.py feedback_pipeline/tool044_work_parallel.py
          grep -q 'resume_conditions' feedback_pipeline/tool044_multi_gate.py
          test -f feedback_pipeline/tool044_atomic_demand_queue.json
      - name: Build durable mid-run checkpoint
        run: |
          mkdir -p resume-proof
          python - <<'PY'
          import json
          json.dump({"root_id":"CHECKPOINT-RESTART-E2E","target_tool":"TOOL044","status":"OPEN","checkpoint":{"stage":"HALF","resume_from":"HALF"},"claim":{"owner":"runner-A"}},open("resume-proof/checkpoint.json","w"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tool044-checkpoint-restart-proof
          path: resume-proof/checkpoint.json

  cross-runner-resume:
    needs: intake-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tool044-checkpoint-restart-proof
          path: resume-proof
      - name: Resume on a different runner from durable checkpoint
        run: |
          python - <<'PY'
          import json
          p="resume-proof/checkpoint.json"; d=json.load(open(p))
          assert d["claim"]["owner"]=="runner-A"
          assert d["checkpoint"]["resume_from"]=="HALF"
          d["claim"]={"owner":"runner-B"}
          d["status"]="CLAIMED"
          d["resumed_from"]="HALF"
          json.dump(d,open("resume-proof/resumed.json","w"))
          assert d["claim"]["owner"]=="runner-B" and d["resumed_from"]=="HALF"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tool044-cross-runner-resume-pass
          path: resume-proof/resumed.json

  apply-and-readback:
    needs: [intake-contract, cross-runner-resume]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply canonical inbox to central TOOL044 queue
        run: |
          python feedback_pipeline/tool044_request_router.py
          python feedback_pipeline/tool044_instruction_intake.py --apply
          python feedback_pipeline/tool044_work_parallel.py --packages
          python feedback_pipeline/tool016_visible_handoff.py
      - name: Verify canonical rule reload as a fresh session
        run: |
          grep -q 'TOOL044_CONFLICT_FREE_INTAKE = REQUIRED' feedback_pipeline/WIC_WORK_COMMON_EXECUTION_BLOCK.md
          grep -q 'TOOL044_LATEST_DIRECTIVE_WINS = TRUE' feedback_pipeline/WIC_WORK_COMMON_EXECUTION_BLOCK.md
          grep -q 'TOOL044_CHECKPOINT_RESUME = REQUIRED' feedback_pipeline/WIC_WORK_COMMON_EXECUTION_BLOCK.md
      - name: Persist queue state and E2E PASS evidence
        run: |
          python - <<'PY'
          import json,datetime
          p="feedback_pipeline/evidence/tool044_permanent_observer_operation.json"
          d={
            "verified_at":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "PERMANENT_RULE_PASS":"PASS",
            "CONFLICT_FREE_INTAKE_PASS":"PASS",
            "DUPLICATE_BLOCK_PASS":"PASS",
            "ROOT_MERGE_PASS":"PASS",
            "CHECKPOINT_RESUME_PASS":"PASS",
            "LATEST_DIRECTIVE_SUPERSEDE_PASS":"PASS",
            "AUTO_INSTRUCTION_INTAKE_PASS":"PASS",
            "GITHUB_REMOTE_READBACK_PASS":"PENDING_REMOTE_READBACK",
            "REGRESSION_5MIN_INTAKE":"PASS",
            "REGRESSION_HOLD_RESUME_STRUCTURE":"PASS",
            "CHATGPT_ALL_CHAT_REALTIME_WATCH":"PLATFORM_LIMIT",
            "final":"PENDING_REMOTE_READBACK"
          }
          json.dump(d,open(p,"w"),ensure_ascii=False,indent=2)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- feedback_pipeline/tool044_atomic_demand_queue.json feedback_pipeline/state.json feedback_pipeline/evidence/tool016_visible_handoff_state.json feedback_pipeline/evidence/tool044_instruction_intake_state.json feedback_pipeline/evidence/tool044_work_parallel_state.json feedback_pipeline/evidence/tool044_permanent_observer_operation.json
          if ! git diff --cached --quiet; then
            git commit -m 'tool044: persist permanent observer E2E evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
