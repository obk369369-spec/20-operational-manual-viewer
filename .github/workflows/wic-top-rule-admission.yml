name: WIC Top Rule Admission Boundary

on:
  push:
    paths:
      - 'CONTROL_TOWER/controller/github_runtime_cycle.py'
      - '.github/workflows/wic-top-rule-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changed-boundary-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove pre-execution block and current-rule allow
        env:
          PYTHONPATH: CONTROL_TOWER/controller
        run: |
          python - <<'PY'
          import json
          import os
          import wic_top_controller as body
          import github_runtime_cycle as runtime
          from runtime_progress_gate import canonical_rule_manifest

          root = body.ROOT
          valid = canonical_rule_manifest(root, 'CENTRAL')
          assert not valid['missing'], valid
          valid['conflicts'] = []
          valid['source_records_verified'] = True
          assert runtime.top_level_rule_admission(None)['reason'] == 'RULE_CONTEXT_MISSING'
          assert runtime.top_level_rule_admission('{bad')['decision'] == 'BLOCK'
          assert runtime.top_level_rule_admission(json.dumps(valid))['decision'] == 'ALLOW'
          stale = dict(valid, version='stale')
          assert runtime.top_level_rule_admission(json.dumps(stale))['reason'] == 'RULE_CONTEXT_STALE_OR_TAMPERED'
          conflicted = dict(valid, conflicts=['unresolved'])
          assert runtime.top_level_rule_admission(json.dumps(conflicted))['reason'] == 'RULE_CONFLICT_UNRESOLVED'
          unverified = dict(valid, source_records_verified=False)
          assert runtime.top_level_rule_admission(json.dumps(unverified))['reason'] == 'REQUIRED_SOURCE_RECORDS_UNVERIFIED'
          import hashlib
          from pathlib import Path
          import tempfile
          task = canonical_rule_manifest(root, 'TOOL042')
          task.update(conflicts=[], source_records_verified=True)
          work_id = 'requirement:42'
          contract = {'execution_contracts': [{'id': 'TEST-42', 'requirement_ids': [42], 'task_id': 'TOOL042'}]}
          with tempfile.NamedTemporaryFile(mode='w', suffix='.json', prefix='rule-admission-',
                                           dir=root / 'feedback_pipeline' / 'evidence',
                                           encoding='utf-8', delete=False) as fixture:
              json.dump({'work_id': work_id, 'task_id': 'TOOL042', 'source_records_verified': True,
                         'validation_result': 'PASS', 'validator_id': 'ISOLATED_TEST_VALIDATOR',
                         'rule_version': task['version'],
                         'validation_plan': {'method': 'isolated exact-source check',
                                             'expected_result': 'MATCH',
                                             'evidence_required': 'original and independent verdict'},
                         'source_refs': [{'path': 'WIC_GLOBAL_OPERATING_RULES.md',
                                          'sha256': hashlib.sha256(
                                              (root / 'WIC_GLOBAL_OPERATING_RULES.md').read_bytes()).hexdigest()}]}, fixture)
              fixture_path = Path(fixture.name)
          try:
              source = {'path': fixture_path.relative_to(root).as_posix(),
                        'sha256': hashlib.sha256(fixture_path.read_bytes()).hexdigest()}
              admission = {'work_id': work_id, 'task_id': 'TOOL042',
                           'rule_context': task, 'source_receipt': source}
              admission['official_lanes'] = {
                  'RULES': {'work_id': work_id, 'task_id': 'TOOL042', 'rule_version': task['version']},
                  'COMPONENTS': {'work_id': work_id, 'task_id': 'TOOL042', 'component_ids': [],
                                 'registry_sha256': hashlib.sha256(
                                     (root / 'feedback_pipeline/VERIFIED_COMPONENT_REGISTRY.json').read_bytes()).hexdigest()}
              }
              queue = {'queued_requirement_ids': [42], 'rule_admissions': {work_id: admission}}
              assert runtime.queued_work_admission(queue, contract)['decision'] == 'ALLOW'
              from runtime_progress_gate import accept_handoff
              fixture_registry = json.loads((root / 'CONTROL_TOWER/controller/component_registry.json').read_text(
                  encoding='utf-8'))
              envelope = {'trace_id': work_id, 'root_id': 'ISOLATED-TWO-LANE-HANDOFF',
                          'task_id': 'TOOL042', 'input': 'isolated input',
                          'expected_output': 'isolated output', 'work_admission': admission}
              gate_state = {'seen_signatures': [], 'stopped_roots': {},
                            'last_checkpoint': {}, 'events': []}
              blocked_handoff = accept_handoff({}, {}, fixture_registry,
                  dict(envelope, work_admission=None), dict(gate_state))
              assert blocked_handoff['status'] == 'BLOCKED' and (
                  blocked_handoff['reason'] == 'WORK_ADMISSION_IDENTITY_MISMATCH'), blocked_handoff
              accepted_handoff = accept_handoff({}, {}, fixture_registry, envelope, gate_state)
              assert accepted_handoff['status'] == 'ACCEPTED', accepted_handoff
              for change, expected in [
                  ({'work_id': 'requirement:43'}, 'WORK_ADMISSION_IDENTITY_MISMATCH'),
                  ({'task_id': 'TOOL013'}, 'WORK_ADMISSION_IDENTITY_MISMATCH'),
                  ({'rule_context': dict(task, version='stale')}, 'RULE_CONTEXT_STALE_OR_TAMPERED'),
                  ({'rule_context': dict(task, conflicts=['unresolved'])}, 'RULE_CONFLICT_UNRESOLVED'),
                  ({'rule_context': dict(task, source_records_verified=False)}, 'REQUIRED_SOURCE_RECORDS_UNVERIFIED'),
                  ({'source_receipt': dict(source, sha256='bad')}, 'SOURCE_VALIDATION_RECEIPT_STALE_OR_TAMPERED'),
                  ({'official_lanes': {}}, 'OFFICIAL_LANES_MISSING_OR_EXTRA'),
              ]:
                  test_queue = {'queued_requirement_ids': [42],
                                'rule_admissions': {work_id: dict(admission, **change)}}
                  result = runtime.queued_work_admission(test_queue, contract)
                  assert result['decision'] == 'BLOCK' and result['receipts'][0]['reason'] == expected, result
              assert runtime.queued_work_admission({'queued_requirement_ids': [42]}, contract)['decision'] == 'BLOCK'
              assert runtime.queued_work_admission(queue, {'execution_contracts': [
                  {'id': 'NO-TASK', 'requirement_ids': [42]}]})['decision'] == 'BLOCK'
          finally:
              fixture_path.unlink()
          os.environ.pop('WIC_RULE_CONTEXT_JSON', None)
          def forbidden_lock():
              raise AssertionError('QUEUE_OR_WORKER_REACHED_BEFORE_RULE_GATE')
          body.acquire_lock = forbidden_lock
          try:
              runtime.main()
          except PermissionError as exc:
              assert 'TOP_LEVEL_RULE_ADMISSION_DENIED:RULE_CONTEXT_MISSING' in str(exc), exc
          else:
              raise AssertionError('UNAUTHORIZED_RUNTIME_STARTED')
          print('PASS TOP_LEVEL_PRE_EXECUTION_BLOCK_AND_CURRENT_RULE_ALLOW')
          PY
