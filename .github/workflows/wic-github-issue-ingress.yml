name: WIC GitHub issue ingress adapter

on:
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: wic-github-issue-ingress-${{ github.event.issue.id }}
  cancel-in-progress: false

jobs:
  dispatch-wic-feedback:
    if: github.event.issue.user.login == github.repository_owner && (startsWith(github.event.issue.title, '[WIC]') || startsWith(github.event.issue.title, 'TOOL'))
    runs-on: ubuntu-latest
    steps:
      - name: Normalize real GitHub issue and dispatch canonical WIC event
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const originalContent = issue.body || issue.title;
            const branch = await github.rest.repos.getBranch({
              owner: context.repo.owner, repo: context.repo.repo, branch: context.payload.repository.default_branch
            });
            const canonical = await github.rest.repos.getContent({
              owner: context.repo.owner, repo: context.repo.repo, path: 'WIC_GLOBAL_OPERATING_RULES.md',
              ref: branch.data.commit.sha
            });
            const canonicalText = Buffer.from(canonical.data.content, 'base64').toString('utf8');
            const noDiffVerified = originalContent.trim().length > 0 && canonicalText.includes(originalContent.trim());
            const eventJson = {
              event_kind: 'WIC_EXTERNAL_GITHUB_ISSUE',
              source_chat: 'github_issue',
              tool_id: 'CENTRAL',
              source_ref: issue.html_url,
              feedback: originalContent,
              actual_input_ref: `github_issue:${issue.id}`,
              wrong_output_ref: 'NONE',
              expected: 'Route through TOOL016 and preserve source lineage',
              source_id: String(issue.id),
              timestamp: issue.created_at,
              registration_mode: 'CENTRAL_LANE_PROVISIONAL',
              mutation_action: 'APPLY_FEEDBACK',
              directive_text: `피드백 적용: ${issue.title}\n${originalContent}`,
              directive_source_ref: `CURRENT_CHAT#github-owner-issue-${issue.id}`,
              github_owner_verified: true,
              github_issue_author: issue.user.login
            };
            if (noDiffVerified) {
              eventJson.material_decision = 'NO_TARGET_DIFF_REQUIRED';
              eventJson.no_diff_proof = { master_revision: branch.data.commit.sha };
            }
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'wic_feedback',
              client_payload: { event_json: JSON.stringify(eventJson) }
            });
            core.info(JSON.stringify({
              source_id: eventJson.source_id,
              source_ref: eventJson.source_ref,
              timestamp: eventJson.timestamp,
              event_type: 'wic_feedback',
              registration_mode: eventJson.registration_mode,
              mutation_action: eventJson.mutation_action,
              directive_source_ref: eventJson.directive_source_ref,
              github_owner_verified: eventJson.github_owner_verified
            }));
