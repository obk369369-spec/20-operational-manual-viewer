<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOOL044 24시간 자동작업 — V2 검증본</title><style>
:root{--ink:#172033;--muted:#647087;--line:#dbe4ef;--bg:#f3f7fb;--ok:#087a55}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic",sans-serif}main{width:min(1080px,calc(100% - 28px));margin:28px auto}h1{font-size:clamp(26px,5vw,42px);margin:0}.sub{color:var(--muted)}.hero,.card,.feedback{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}.hero{display:flex;justify-content:space-between;align-items:center;margin:22px 0}.badge{font-weight:900;color:var(--ok)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.label{display:block;color:var(--muted);font-size:13px;margin-bottom:8px}.value{font-weight:800;word-break:break-word}.feedback{margin-top:14px}textarea{width:100%;min-height:88px;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}button{margin-top:9px;padding:12px 18px;border:0;border-radius:10px;background:#172033;color:#fff;font-weight:800}#receipt{white-space:pre-wrap;margin-top:10px;color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero{display:block}}
</style></head><body><main><h1>TOOL044 24시간 자동작업</h1><p class="sub">기존 운영 관찰판을 교체하지 않는 별도 V2 검증본</p>
<section class="hero"><div><span class="label">실제 상태</span><span class="badge" id="status">불러오는 중</span></div><div><span class="label">SAFE_CHECKPOINT</span><strong id="checkpoint">—</strong></div></section>
<div class="grid"><section class="card"><span class="label">현재 대상</span><div class="value" id="tool">—</div></section><section class="card"><span class="label">현재 제작 기능</span><div class="value" id="function">—</div></section><section class="card"><span class="label">현재 단계</span><div class="value" id="stage">—</div></section><section class="card"><span class="label">현재 atomic capability</span><div class="value" id="atomic">—</div></section><section class="card"><span class="label">마지막 heartbeat</span><div class="value" id="heartbeat">—</div></section><section class="card"><span class="label">queue / 검증 원자부품</span><div class="value" id="counts">—</div></section><section class="card"><span class="label">최근 검증 조합</span><div class="value" id="growth">—</div></section><section class="card"><span class="label">검증 조합 / 최근 오류</span><div class="value" id="composition">—</div></section></div>
<section class="feedback"><h2>기능 피드백</h2><label class="label" for="tool-id">관련 TOOL</label><input id="tool-id" value="TOOL044"><label class="label" for="text">사용자 원문</label><textarea id="text" placeholder="예: PDF 브로셔도 별도로 제외해라."></textarea><button id="send">16번→44번에 전달</button><div id="receipt" role="status" aria-live="polite"></div></section></main>
<script>
const $=id=>document.getElementById(id);async function refresh(){try{const r=await fetch('/api/status');const s=await r.json();$('status').textContent=s.status;$('checkpoint').textContent=s.checkpoint||'없음';$('tool').textContent=s.current_tool;$('function').textContent=s.current_function;$('stage').textContent=s.current_stage;$('atomic').textContent=(s.atomic_capabilities||[]).join(' + ')||'없음';$('heartbeat').textContent=s.last_heartbeat||'없음';$('counts').textContent=`${s.queue_count} / ${s.verified_atomic_count}`;const g=s.latest_composition;$('growth').textContent=g?`${(g.components||[]).join(' + ')} → ${g.composition_id} (${g.status})`:'없음';$('composition').textContent=`${s.verified_composition_count} / ${s.recent_error||'오류 없음'}`;}catch(e){$('status').textContent='STOPPED — 로컬 V2 실행 필요';}}refresh();setInterval(refresh,30000);
$('send').onclick=async()=>{const text=$('text').value.trim();if(!text){$('receipt').textContent='원문을 입력하세요.';return}const body={source_chat_or_tool:'TOOL044_OBSERVER_V2',tool_id:$('tool-id').value.trim(),user_original_text:text,timestamp:new Date().toISOString()};try{const r=await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const x=await r.json();$('receipt').textContent=`${x.status} · SOURCE ${x.source_id} · ROOT ${x.root_id} · ${x.tool044_status} · ${x.tool044_demand_id||'TOOL016 검토'}`;await refresh();}catch(e){$('receipt').textContent='전달 실패: V2 로컬 실행 상태를 확인하세요.';}};
</script></body></html>
