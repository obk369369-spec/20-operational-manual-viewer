<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>소형 앱 출시 실행도구 - 관찰자 작업대</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f4f4f1;color:#171717}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0}.dark{background:#202020;color:#fff}textarea{width:100%;min-height:110px;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #bbb;font-size:16px}button{padding:12px 16px;margin:5px 5px 5px 0;border:0;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}.primary{background:#1f6f43;color:#fff}.hold{background:#d6aa32;color:#111}.ghost{background:#e8e8e8}.status{font-weight:800}.row{display:flex;gap:8px;flex-wrap:wrap}.mono{font-family:ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;font-size:13px}</style>
</head>
<body>
<div class="wrap">
<h1>소형 앱 출시 실행도구</h1>
<div class="card dark"><div>관찰자 작업대</div><h2 id="judge">현재 판정: HOLD</h2><div id="summary">아이디어를 잠그면 실행 상태를 기록할 수 있습니다.</div></div>
<div class="card">
<h2>1. 아이디어</h2>
<textarea id="idea" placeholder="만들고 싶은 앱/사이트 아이디어를 자유롭게 입력"></textarea>
<div class="row"><button class="primary" id="lockIdea">아이디어 잠금</button><button class="ghost" id="clearIdea">초기화</button></div>
</div>
<div class="card">
<h2>2. 관찰자 명령</h2>
<div class="row"><button class="primary" id="go">진행 승인</button><button class="hold" id="pause">보류</button></div>
<p>마지막 명령: <span class="status" id="cmd">없음</span></p>
<p>기록 시각: <span id="time">없음</span></p>
</div>
<div class="card">
<h2>3. 실행 증거</h2>
<p>GitHub 실행본: <span class="status">CONNECTED</span></p>
<p>외부 출시/스토어 배포: <span class="status">HOLD</span></p>
<button class="ghost" id="exportBtn">증거 JSON 내보내기</button>
<pre class="mono" id="evidence"></pre>
</div>
</div>
<script>
const KEY='wic_tool040_state_v1'; // legacy storage key: 사용자 도구 번호가 아님
const $=id=>document.getElementById(id);
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{idea:'',locked:false,command:'',updatedAt:''}}catch(e){return{idea:'',locked:false,command:'',updatedAt:''}}}
function save(s){localStorage.setItem(KEY,JSON.stringify(s));render(s)}
function render(s){$('idea').value=s.idea||'';$('cmd').textContent=s.command||'없음';$('time').textContent=s.updatedAt||'없음';const connected=!!s.locked;$('judge').textContent='현재 판정: '+(connected?'PARTIAL PASS':'HOLD');$('summary').textContent=connected?'GitHub 최소 실행본 연결 완료. 외부 실제 출시 증거는 별도 검증 필요.':'아이디어를 잠그면 실행 상태를 기록할 수 있습니다.';$('evidence').textContent=JSON.stringify({tool_name:'소형 앱 출시 실행도구',legacy_route_key:'TOOL040',idea_locked:!!s.locked,command:s.command||null,updated_at:s.updatedAt||null,github_runtime:'CONNECTED',external_launch:'HOLD'},null,2)}
function now(){return new Date().toISOString()}
$('lockIdea').onclick=()=>{const s=load();const v=$('idea').value.trim();if(!v){alert('아이디어를 입력하세요.');return}s.idea=v;s.locked=true;s.updatedAt=now();save(s)};
$('clearIdea').onclick=()=>{localStorage.removeItem(KEY);render(load())};
$('go').onclick=()=>{const s=load();s.command='진행';s.updatedAt=now();save(s)};
$('pause').onclick=()=>{const s=load();s.command='보류';s.updatedAt=now();save(s)};
$('exportBtn').onclick=()=>{const s=load();const data={tool_name:'소형 앱 출시 실행도구',legacy_route_key:'TOOL040',idea:s.idea,idea_locked:!!s.locked,command:s.command||null,updated_at:s.updatedAt||null,github_runtime:'CONNECTED',external_launch:'HOLD'};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='small-app-launch-evidence.json';a.click();URL.revokeObjectURL(a.href)};
render(load());
</script>
</body>
</html>
