<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WIC 관찰자 현황판</title>
<style>
body{margin:0;background:#f3f7fb;color:#17324d;font-family:system-ui,"Malgun Gothic",sans-serif}main{max-width:920px;margin:auto;padding:28px 18px}.hero{background:#1769aa;color:white;border-radius:24px;padding:28px;box-shadow:0 8px 24px #1232}.hero h1{font-size:clamp(28px,6vw,48px);margin:0 0 10px}.hero p{font-size:20px;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:18px 0}.card{background:white;border-radius:20px;padding:20px;box-shadow:0 4px 16px #1231}.card h2{font-size:19px;margin:0 0 10px;color:#345}.big{font-size:36px;font-weight:800}.good{color:#16834b}.wait{color:#b66b00}.stop{color:#a83232}details{background:white;border-radius:16px;padding:16px;margin-top:14px}summary{cursor:pointer;font-weight:700;font-size:18px}li{margin:8px 0;line-height:1.45}#error{display:none;background:#fff0f0;color:#8b2525;padding:14px;border-radius:12px}</style></head>
<body><main><section class="hero"><h1>WIC 작업 현황</h1><p id="doing">상태를 불러오고 있습니다.</p><p id="state">잠시만 기다려 주세요.</p></section><div id="error"></div>
<section class="grid"><div class="card"><h2>끝난 일</h2><div id="done" class="big good">-</div></div><div class="card"><h2>아직 할 일</h2><div id="left" class="big wait">-</div></div><div class="card"><h2>지금 할 수 없는 일</h2><div id="held" class="big stop">-</div></div><div class="card"><h2>마지막 상태 변경</h2><div id="updated">-</div></div></section>
<section class="card"><h2>방금 끝난 일</h2><p id="recent">불러오는 중입니다.</p><h2>다음 할 일</h2><p id="next">불러오는 중입니다.</p><h2>기다리는 이유</h2><p id="why">불러오는 중입니다.</p></section>
<section class="card"><h2>도구별 남은 일과 예상기간</h2><div id="tools">불러오는 중입니다.</div></section>
<details><summary>자세히 보기</summary><div id="details"></div><details id="tech"><summary>기술정보</summary><div id="technical"></div></details></details>
</main><script>
const DATA='https://raw.githubusercontent.com/obk369369-spec/20-operational-manual-viewer/main/feedback_pipeline/evidence/wic_non_tool_observer_closeout_report.json';
const STATE='https://raw.githubusercontent.com/obk369369-spec/20-operational-manual-viewer/main/feedback_pipeline/evidence/tool016_visible_handoff_state.json';
const ko={COMPLETE:'끝남',PARTIAL:'일부 진행',UNFINISHED:'아직 시작·완료 안 됨',PLATFORM_HOLD:'서비스 제한으로 기다림',LONG_TERM_HOLD:'시간이 지나기를 기다림'};
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function friendly(id){id=String(id||'');if(id.includes('PERMANENT-OBSERVER-INTAKE'))return '44번이 새 작업을 자동으로 받아오는 기능';if(id.includes('WORK-PARALLEL-NO-CONFLICT'))return '여러 작업이 서로 겹치지 않게 나누는 기능';if(id.includes('AUTO-ROLLBACK'))return '실패하면 안전한 상태로 되돌리는 기능';if(id.includes('ARBITRARY-WIC-DEPLOY'))return '검증한 결과를 실제 사용 위치에 놓는 기능';if(id.includes('RETROSPECTIVE'))return '예전에 생긴 오류와 요청을 자동으로 모으는 기능';if(id.includes('CROSS_RUNTIME'))return '여러 실행 장소에서 같은 일을 두 번 하지 않게 하는 기능';if(id.includes('24H'))return '하루 동안 쉬지 않고 작동했다는 증거 모으기';if(id.includes('TOOL043'))return '43번 기능의 역할이 겹치는지 따로 살펴보는 일';if(id.includes('CHAT-REPORT'))return '44번 대화창에 결과를 직접 알려주는 기능';if(id.includes('EXTERNAL'))return '다른 무료 실행 장소를 연결하는 기능';if(id.includes('TOOL016'))return '16번이 오류와 남은 일을 자동으로 모으는 기능';if(id.includes('TOOL044'))return '44번이 필요한 작업을 자동으로 처리하는 기능';return 'WIC 공통 자동화 개선 작업'}
function easyResume(x){const r=String(x.resume_condition||'');if(r.includes('PLATFORM')||r.includes('API'))return '서비스에서 공식 연결 방법을 제공하면 자동으로 다시 확인합니다.';if(r.includes('NATURAL_TIME'))return '실제 시간이 충분히 지나면 자동으로 다시 확인합니다.';if(r.includes('SEPARATE_EXPLICIT'))return '43번을 따로 살펴보는 작업이 시작될 때만 진행합니다.';return '필요한 장치가 준비되면 자동으로 다시 시작합니다.'}
function rows(data,key){return (data[key]||[]).filter(x=>!String(x.requirement_id||'').includes('TOOL043-')||x.requirement_id==='TOOL043-HOLD-REEVALUATE')}
function groupName(id){id=String(id||'');if(id.includes('TOOL016'))return '16번 — 오류와 남은 일 모으기';if(id.includes('TOOL044'))return '44번 — 중앙 자동순환';if(id.includes('WORK-HANDOFF'))return 'Work 자동 연결';if(id.includes('EXTERNAL')||id.includes('MULTI-RUNNER'))return '외부 실행장치';if(id.includes('24H'))return '24시간 무인운영';if(id.includes('TOOL043'))return '43번 — 별도 재검토 대기';return '전체 공통 자동화'}
function period(items,state){if(!items.length)return '완료';if(items.some(x=>String(x.resume_condition||'').includes('NATURAL_TIME'))){const h=Number(state?.SCHEDULE_EVIDENCE?.elapsed_hours||0);return h>0?Math.max(0,24-h).toFixed(1)+'시간 남음':'24시간 증거를 모으는 중'}return '계산 중'}
function toolRows(all,state){const groups={};all.forEach(x=>(groups[groupName(x.requirement_id)]??=[]).push(x));return Object.entries(groups).map(([name,items])=>'<div style="padding:14px 0;border-bottom:1px solid #dce5ed"><b>'+name+'</b><br>남은 작업: '+items.map(x=>friendly(x.requirement_id)).filter((v,i,a)=>a.indexOf(v)===i).join(', ')+'<br>남은 수: '+items.length+'개<br>현재: '+(items.some(x=>x.status==='PLATFORM_HOLD'||x.status==='LONG_TERM_HOLD')?'기다리는 중':'자동 처리 준비 중')+'<br>예상 남은 기간: '+period(items,state)+'</div>').join('')||'<b>완료된 도구</b><br>남은 작업 없음<br>현재: 완료'}
async function refresh(){try{const [r,sr]=await Promise.all([fetch(DATA+'?t='+Date.now(),{cache:'no-store'}),fetch(STATE+'?t='+Date.now(),{cache:'no-store'})]);if(!r.ok)throw Error('상태 파일을 읽지 못했습니다.');const d=await r.json(),state=sr.ok?await sr.json():{};const done=rows(d,'COMPLETE'),partial=rows(d,'PARTIAL'),unfinished=rows(d,'UNFINISHED'),platform=rows(d,'PLATFORM_HOLD'),longterm=rows(d,'LONG_TERM_HOLD');const left=partial.length+unfinished.length,held=platform.length+longterm.length;
document.querySelector('#done').textContent=done.length+'개';document.querySelector('#left').textContent=left+'개';document.querySelector('#held').textContent=held+'개';document.querySelector('#doing').textContent=d.NEXT_WORK?'지금 하는 일: '+d.NEXT_WORK:'지금 하는 일: 바로 실행할 수 있는 다음 일을 기다리고 있습니다.';document.querySelector('#state').textContent=left?'현재 상태: 남은 일을 자동으로 살펴보고 있습니다.':'현재 상태: 할 수 있는 일은 모두 끝났습니다.';document.querySelector('#recent').textContent=done.length?done.slice(-3).map(x=>x.requirement_id).join(', '):'아직 표시할 완료 작업이 없습니다.';document.querySelector('#next').textContent=d.NEXT_WORK||'필요한 조건이 준비되면 자동으로 다시 시작합니다.';document.querySelector('#why').textContent=held?held+'개는 서비스 제한 또는 실제 시간 경과 때문에 기다리고 있습니다.':'기다리는 일이 없습니다.';document.querySelector('#updated').textContent=new Date(r.headers.get('last-modified')||Date.now()).toLocaleString('ko-KR');
document.querySelector('#tools').innerHTML=toolRows([...partial,...unfinished,...platform,...longterm],state);
document.querySelector('#details').innerHTML=['PARTIAL','UNFINISHED','PLATFORM_HOLD','LONG_TERM_HOLD'].map(k=>'<h3>'+ko[k]+' ('+rows(d,k).length+')</h3><ul>'+rows(d,k).map(x=>'<li><b>'+friendly(x.requirement_id)+'</b><br>'+easyResume(x)+'</li>').join('')+'</ul>').join('');document.querySelector('#technical').innerHTML=['PARTIAL','UNFINISHED','PLATFORM_HOLD','LONG_TERM_HOLD'].map(k=>'<h3>'+k+'</h3><ul>'+rows(d,k).map(x=>'<li>'+esc(x.requirement_id)+' — '+esc(x.resume_condition)+'</li>').join('')+'</ul>').join('');document.querySelector('#error').style.display='none'}catch(e){document.querySelector('#error').textContent='현황을 불러오지 못했습니다. 자동으로 다시 시도합니다.';document.querySelector('#error').style.display='block'}}refresh();setInterval(refresh,60000);
</script></body></html>
