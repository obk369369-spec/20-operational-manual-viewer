<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WIC 웹사이트 안심 점검</title>
<style>body{font-family:system-ui,sans-serif;margin:0;background:#f4f7fb;color:#16243a}.wrap{max-width:900px;margin:auto;padding:28px}.hero,.card{background:white;border-radius:18px;padding:24px;margin:14px 0;box-shadow:0 5px 20px #19375a18}.hero{background:#173b68;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.ok{color:#08783e;font-weight:800}.wait{color:#9a6500;font-weight:800}a.button{display:inline-block;background:#ffcf4a;color:#17243a;padding:13px 18px;border-radius:12px;text-decoration:none;font-weight:800}.small{color:#607086}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #e4e9f0;text-align:left}</style></head>
<body><main class="wrap"><section class="hero"><h1>웹사이트가 잘 열리는지 자동으로 확인합니다</h1><p>WIC가 공개 웹사이트를 실제로 열어 보고, 속도와 오류를 쉬운 말로 알려드립니다.</p><a class="button" href="mailto:obk369369@gmail.com?subject=WIC 웹사이트 안심 점검 문의">점검 서비스 문의하기</a></section>
<section class="grid"><div class="card"><h2>지금 상태</h2><div id="now">불러오는 중…</div></div><div class="card"><h2>확인한 도구</h2><div id="tools">-</div></div><div class="card"><h2>수익 단계</h2><div id="revenue">고객 반응과 실제 결제는 기다리는 중입니다.</div></div></section>
<section class="card"><h2>실제 점검 결과</h2><table><thead><tr><th>점검 대상</th><th>결과</th><th>응답 시간</th></tr></thead><tbody id="checks"></tbody></table></section>
<section class="card"><h2>다음 자동 작업</h2><p id="next">상태를 불러오는 중입니다.</p><p class="small">실제 고객 문의·주문·결제·매출이 생기기 전에는 매출 완료로 표시하지 않습니다.</p></section></main>
<script>fetch('./state.json?'+Date.now()).then(r=>r.json()).then(s=>{document.querySelector('#now').innerHTML=`<span class="ok">자동 점검 완료</span><br><small>${s.finished_at}</small>`;document.querySelector('#tools').textContent=`${s.tool_inventory_count}개 도구를 자동 회수했습니다.`;document.querySelector('#revenue').innerHTML=`외부 수익 근거 <span class="ok">확인</span><br>실제 매출 <span class="wait">기다리는 중</span>`;document.querySelector('#next').textContent=s.next_cycle;document.querySelector('#checks').innerHTML=s.pilot.monitors.map(x=>`<tr><td>${x.name}</td><td class="${x.status==='PASS'?'ok':'wait'}">${x.status==='PASS'?'정상':'확인 필요'}</td><td>${x.elapsed_ms}ms</td></tr>`).join('')}).catch(()=>document.querySelector('#now').textContent='최신 결과를 불러오지 못했습니다.');</script></body></html>
