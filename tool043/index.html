<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>43번 WIC 모바일 관찰자</title><meta name="theme-color" content="#202020"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>body{font-family:system-ui,sans-serif;margin:0;background:#f4f4f1;color:#171717}.wrap{max-width:680px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;margin:12px 0}.hero{background:#202020;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.value{font-size:1.7rem;font-weight:800}.label{color:#666}.hero .label{color:#ccc}details{margin-top:12px}pre{white-space:pre-wrap;word-break:break-word}</style></head>
<body><main class="wrap"><h1>43번 WIC 모바일 관찰자</h1>
<section class="card hero"><div class="label">43번 자체 상태</div><div class="value" id="current">확인 중</div><p id="freshness">최신 장부 확인 중</p><div id="work-status">업무 상태 확인 중</div><p>업무의 미완료·외부 대기는 관찰판 고장과 다릅니다.</p></section>
<section class="grid"><div class="card"><div class="label">최근 야간 처리</div><div class="value" id="processed">-</div></div><div class="card"><div class="label">현재 내부 OPEN</div><div class="value" id="open">-</div></div><div class="card"><div class="label">전체 미처리</div><div class="value" id="remaining">-</div></div><div class="card"><div class="label">막힘·외부조건 대기</div><div class="value" id="blocked">-</div></div></section>
<section class="card"><h2>지금 진행 중</h2><div id="running"></div><h2>현재 미처리 작업</h2><div id="tasks"></div><h2>최근 완료</h2><div id="completed"></div><h2>다음 Work</h2><div id="next">-</div></section>
<section class="card"><div class="label">승인 대기</div><div class="value" id="approvals">-</div><p>승인 대기 중에도 승인 불필요 SAFE 작업은 계속됩니다.</p><div id="approval-list"></div></section>
<section class="card"><div class="label">SAFE CHECKPOINT</div><div id="checkpoint">-</div><details><summary>상세 상태</summary><pre id="detail"></pre></details></section>
</main><script>
const el=id=>document.getElementById(id),CACHE_KEY='wic_tool043_last_status_v1';
function checked(s){const w=s.current_work;if(!w||!w.conservation_pass)throw Error('장부 보존 검사 실패');for(const k of ['remaining','running','waiting','pending'])if(!Array.isArray(w[k])||w[k].length!==w[k+'_total'])throw Error('목록/숫자 불일치');const ids=w.remaining.map(r=>r.root_id),parts=[...w.running,...w.waiting,...w.pending].map(r=>r.root_id);if(new Set(ids).size!==ids.length||parts.length!==ids.length||new Set(parts).size!==ids.length||parts.some(id=>!ids.includes(id)))throw Error('작업 누락/중복');if(s.incomplete_total!==ids.length||s.blocked_work!==w.waiting_total||s.new_open!==w.open_internal_total)throw Error('표시 숫자 불일치');return w}
function list(id,rows,empty){el(id).replaceChildren(...(rows.length?rows.map(r=>{const p=document.createElement('p');p.textContent=r.label+(r.target?' · '+r.target:'')+(r.status?' · '+({'HOLD_EVIDENCE_WAITING':'자료 대기','HOLD':'대기','PLATFORM_LIMIT':'플랫폼 지원 대기','EXTERNAL_PREREQUISITE_BLOCKED':'외부 조건 대기','RUNNING':'진행 중','IN_PROGRESS':'진행 중'}[r.status]||r.status):'');return p}):[document.createTextNode(empty)]))}
function render(s,cached=false){const w=checked(s),age=(Date.now()-Date.parse(s.status_projection_at||s.observer_generated_at))/1000,stale=!Number.isFinite(age)||age< -300||age>(s.max_status_age_seconds||28800);el('current').textContent=cached?'저장 상태 확인 중':stale||s.observer_health!=='OK'?'관찰판 이상':'관찰판 정상';el('freshness').textContent=cached?'저장된 이전 상태 · 최신 확인 중':stale?'상태 갱신 지연 · 마지막 기록 표시':'장부 확인: '+new Date(s.status_projection_at||s.observer_generated_at).toLocaleString('ko-KR');el('work-status').textContent=s.work_status;el('processed').textContent=s.night_processed+'건';el('open').textContent=s.new_open+'건';el('remaining').textContent=w.remaining_total+'건';el('blocked').textContent=s.blocked_work+'건';el('next').textContent=s.next_work;list('running',w.running,'현재 장부에 진행 중인 작업 없음');list('tasks',w.remaining,'현재 미처리 작업 없음');list('completed',w.recent_completed,'최근 완료 기록 없음');el('checkpoint').textContent=s.safe_checkpoint;el('approvals').textContent=(s.approval_pending_total||0)+'건';el('approval-list').replaceChildren(...(s.approval_items||[]).map(a=>{const d=document.createElement('details'),m=document.createElement('summary'),p=document.createElement('pre');m.textContent=a.purpose||'승인 항목';p.textContent=JSON.stringify({reason:a.reason||'',impact:a.expected_impact||'',operations:a.remaining_operations||a.operations||[],queued_at:a.queued_at||''},null,2);d.append(m,p);return d}));el('detail').textContent=JSON.stringify(s,null,2)}
function restore(){try{const s=JSON.parse(localStorage.getItem(CACHE_KEY));if(s)render(s,true)}catch(_){}}
async function refresh(){try{const r=await fetch('./status.json',{cache:'no-store'});if(!r.ok)throw Error(r.status);const s=await r.json();checked(s);render(s);try{localStorage.setItem(CACHE_KEY,JSON.stringify(s))}catch(e){el('current').textContent='관찰판 이상';el('freshness').textContent='현재 결과는 읽었으나 기기 저장 실패'}}catch(e){el('current').textContent='관찰판 이상';el('freshness').textContent='최신 상태 확인 실패 · 기존 목록 유지: '+e.message}}
restore();refresh();setInterval(refresh,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});window.addEventListener('online',refresh);
if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js');
</script></body></html>
