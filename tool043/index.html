<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>43번 WIC 모바일 관찰자</title><meta name="theme-color" content="#202020"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>body{font-family:system-ui,sans-serif;margin:0;background:#f4f4f1;color:#171717}.wrap{max-width:680px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;margin:12px 0}.hero{background:#202020;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.value{font-size:1.7rem;font-weight:800}.label{color:#666}.hero .label{color:#ccc}details{margin-top:12px}pre{white-space:pre-wrap;word-break:break-word}.task{border-top:1px solid #ddd;padding:12px 0}.task:first-child{border-top:0}.task-name{font-weight:750}.task-meta{color:#666;font-size:.9rem;margin-top:4px}.task-result{margin-top:6px}</style></head>
<body><main class="wrap"><h1>43번 WIC 모바일 관찰자</h1>
<section class="card hero"><div class="label">현재 상태</div><div class="value" id="current">확인 중</div><p>사용자는 결과만 봅니다. 시작 버튼이나 터미널 조작은 없습니다.</p></section>
<section class="grid"><div class="card"><div class="label">밤새 처리</div><div class="value" id="processed">-</div></div><div class="card"><div class="label">새 OPEN</div><div class="value" id="open">-</div></div><div class="card"><div class="label">막힌 작업</div><div class="value" id="blocked">-</div></div><div class="card"><div class="label">다음 Work</div><div class="value" id="next">-</div></div></section>
<section class="card"><div class="label">승인 대기</div><div class="value" id="approvals">-</div><p>승인 대기 중에도 승인 불필요 SAFE 작업은 계속됩니다.</p><div id="approval-list"></div></section>
<section class="card"><div class="label">야간 작업 내역</div><div id="night-task-list"><p>처리 기록 없음</p></div></section>\n<section class="card"><div class="label">SAFE CHECKPOINT</div><div id="checkpoint">-</div><details><summary>상세 상태</summary><pre id="detail"></pre></details></section>
</main><script>
const el=id=>document.getElementById(id),CACHE_KEY='wic_tool043_last_status_v1';
function renderTasks(items){const box=el('night-task-list');if(!items.length){box.innerHTML='<p>처리 기록 없음</p>';return}box.replaceChildren(...items.map(t=>{const row=document.createElement('article'),name=document.createElement('div'),meta=document.createElement('div'),result=document.createElement('div');row.className='task';name.className='task-name';meta.className='task-meta';result.className='task-result';name.textContent=t.task_name||'이름 없음';meta.textContent=(t.executed_at||'실행시각 없음')+' · '+(t.status||'상태 없음');result.textContent='결과: '+(t.result||'결과 없음');row.append(name,meta,result);return row}))}\nfunction render(s){renderTasks(s.night_task_items||[]);el('current').textContent=s.current_status;el('processed').textContent=s.night_processed+'건';el('open').textContent=s.new_open+'건';el('blocked').textContent=s.blocked_work+'건';el('next').textContent=s.next_work;el('checkpoint').textContent=s.safe_checkpoint;el('approvals').textContent=(s.approval_pending_total||0)+'건';el('approval-list').replaceChildren(...(s.approval_items||[]).map(a=>{const d=document.createElement('details'),m=document.createElement('summary'),p=document.createElement('pre');m.textContent=a.purpose||'승인 항목';p.textContent=JSON.stringify({reason:a.reason||'',impact:a.expected_impact||'',operations:a.remaining_operations||a.operations||[],queued_at:a.queued_at||''},null,2);d.append(m,p);return d}));el('detail').textContent=JSON.stringify(s,null,2)}
function restore(){try{const s=JSON.parse(localStorage.getItem(CACHE_KEY));if(s)render(s)}catch(_){}}
async function refresh(){try{const r=await fetch('./status.json',{cache:'no-store'});if(!r.ok)throw Error(r.status);const s=await r.json();localStorage.setItem(CACHE_KEY,JSON.stringify(s));render(s)}catch(e){if(!localStorage.getItem(CACHE_KEY)){el('current').textContent='문제';el('detail').textContent='상태 읽기 실패: '+e.message}}}
restore();refresh();setInterval(refresh,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});window.addEventListener('online',refresh);
if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js');
</script></body></html>
