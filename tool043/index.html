<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>43번 WIC 모바일 관찰자</title>
<style>body{font-family:system-ui,sans-serif;margin:0;background:#f4f4f1;color:#171717}.wrap{max-width:680px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;margin:12px 0}.hero{background:#202020;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.value{font-size:1.7rem;font-weight:800}.label{color:#666}.hero .label{color:#ccc}details{margin-top:12px}pre{white-space:pre-wrap;word-break:break-word}</style></head>
<body><main class="wrap"><h1>43번 WIC 모바일 관찰자</h1>
<section class="card hero"><div class="label">현재 상태</div><div class="value" id="current">확인 중</div><p>사용자는 결과만 봅니다. 시작 버튼이나 터미널 조작은 없습니다.</p></section>
<section class="grid"><div class="card"><div class="label">밤새 처리</div><div class="value" id="processed">-</div></div><div class="card"><div class="label">새 OPEN</div><div class="value" id="open">-</div></div><div class="card"><div class="label">막힌 작업</div><div class="value" id="blocked">-</div></div><div class="card"><div class="label">다음 Work</div><div class="value" id="next">-</div></div></section>
<section class="card"><div class="label">SAFE CHECKPOINT</div><div id="checkpoint">-</div><details><summary>상세 상태</summary><pre id="detail"></pre></details></section>
</main><script>
const el=id=>document.getElementById(id);fetch('./status.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(s=>{el('current').textContent=s.current_status;el('processed').textContent=s.night_processed+'건';el('open').textContent=s.new_open+'건';el('blocked').textContent=s.blocked_work+'건';el('next').textContent=s.next_work;el('checkpoint').textContent=s.safe_checkpoint;el('detail').textContent=JSON.stringify(s,null,2)}).catch(e=>{el('current').textContent='문제';el('detail').textContent='상태 읽기 실패: '+e.message});
</script></body></html>
