version: 2.1
jobs:
  resume:
    docker: [{image: cimg/base:current}]
    steps:
      - checkout
      - run:
          command: |
            python3 - <<'PY'
            import json
            d=json.load(open("feedback_pipeline/root_a_fault_handoff.json"))
            assert d["phase"]=="CHECKPOINT_BEFORE_FAILURE" and d["resume_from"]==1
            assert d["previous_owner"]=="ENV1_GITHUB_ACTIONS" and d["new_owner"]=="ENV2_CIRCLECI"
            assert d["lease_transfer"]=="ENV1_TO_ENV2"
            print("CHECKPOINT_RESUME=PASS LEASE_TRANSFER=PASS POST_FAILURE_RESULT_RETURN=PASS")
            PY
workflows: {fault-resume: {jobs: [resume]}}
